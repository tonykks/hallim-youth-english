<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Formulas</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 폰트 설정 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
        }
        .font-mono {
            font-family: 'Roboto Mono', monospace;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const grammarData = {
            "partsOfSpeech": {
                id: "partsOfSpeech",
                title: "1. 8품사 (The 8 Parts of Speech)",
                subtitle: "문장을 구성하는 최소 단위의 재료 (Materials)",
                items: [
                    { 
                        term: "명사(Noun)", 
                        def: "사람, 사물, 장소, 개념의 이름<br>• 사람: Tom(탐), teacher(선생님)<br>• 사물: book(책), apple(사과)<br>• 장소: school(학교), Seoul(서울)<br>• 개념: love(사랑), hope(희망)", 
                        role: "주어(S), 목적어(O), 보어(C) 역할",
                        example: "1. <u>Tom</u> is a <u>student</u>. (톰은 학생 입니다.)<br>Tom(주어), student(보어)<br><br>2. <u>Amy</u> likes <u>pizza</u>. (에이미는 피자를 좋아합니다.)<br>Amy(주어), pizza(목적어)"
                    },
                    { 
                        term: "대명사(Pronoun)", 
                        def: "명사를 대신하여 부르는 말<br>• 1인칭: I(나), We(우리들)<br>• 2인칭: You(너), You(너희들)<br>• 3인칭: He(그), She(그녀), It(그것), They(그들), This(이것), That(저것), These(이것들), Those(저것들)", 
                        role: "명사와 동일 (주어, 목적어, 보어 역할)",
                        example: "1. <u>He</u> is my friend. (그는 나의 친구입니다.)<br>He(주어)<br><br>2. <u>I</u> like <u>you</u>. (나는 너를 좋아합니다.)<br>I(주어), you(목적어)"
                    },
                    { 
                        term: "동사(Verb)", 
                        def: "주어의 동작이나 상태를 서술<br>• <b>동작동사</b>: 시작과 끝이 있어 반복할 수 있고 진행형(~하는 중)을 만들 수 있다. (run: 달리다, walk: 걷다, sing: 노래하다)<br>• <b>상태동사</b>: 움직임이 없는 상태를 나타내며 반복할 수 없고 진행형을 만들 수 없다. (know: 알다, like: 좋아하다, want: 원하다, believe: 믿다)", 
                        role: "문장의 중심, 서술어(V) 역할",
                        example: "1. Amy <u>sings</u> a song. (에이미는 노래를 부릅니다.)<br>Amy(주어), sings(동사)<br><br>2. Tom <u>knows</u> the answer. (탐은 답을 압니다.)<br>Tom(주어), knows(동사)"
                    },
                    { 
                        term: "형용사(Adjective)", 
                        def: "명사의 성질이나 상태를 설명하며 범위를 좁혀주는 말<br>• <b>구체화(한정)</b>: 넓은 범위를 필터링하여 좁혀줌<br>• fresh <u>air</u> (상쾌한 공기): 모든 공기 → 상쾌한 공기<br>• a white <u>cat</u> (흰 고양이): 모든 고양이 → 흰 고양이", 
                        role: "명사 수식 및 주어의 상태 설명(보어)<br>• <b>명사 보어</b>: 주어의 '자격/신분' (I am a student)<br>• <b>형용사 보어</b>: 주어의 '성질/상태' (I am happy)",
                        example: "1. Mary is a <u>pretty</u> girl. (메리는 예쁜 소녀다.)<br>pretty(명사 girl을 직접 수식)<br><br>2. Mary is <u>pretty</u>. (메리는 예쁘다.)<br>pretty(주어 Mary의 상태를 보충 설명)"
                    },
                    { 
                        term: "부사(Adverb)", 
                        def: "명사 이외의 것(동사, 형용사, 다른 부사, 문장 전체)을 수식하는 말입니다. 가장 핵심 기능은 <b>동사 수식</b>입니다.", 
                        role: "수식어(M) - 문장 성분(S, V, O, C)에는 포함되지 않음",
                        example: "1. <b>형용사 수식</b> (형용사 앞): She is <u>very</u> kind. (매우 친절하다)<br>2. <b>부사 수식</b> (부사 앞): He runs <u>very</u> fast. (매우 빨리 달린다)<br>3. <b>문장 전체 수식</b> (문장 앞): <u>Honestly</u>, I don’t know. (솔직히 모른다)<br>4. <b>동사 수식 (가장 중요)</b>:<br>• 일반: She runs <u>fast</u>. (빨리 달린다) - 문장 끝<br>• 빈도: He <u>always</u> studies. (항상 공부한다) - 동사 앞 / He is <u>always</u> late. (항상 늦는다) - be동사 뒤"
                    },
                    { 
                        term: "전치사(Preposition)", 
                        def: "명사 앞에 놓여 명사와의 관계를 설정하는 <b>관계 설정자</b>입니다.<br>• 반드시 뒤에 명사가 오며, 이를 <b>전명구</b>(전치사+명사)라고 부릅니다.<br>• in(안에), on(위에), under(아래에), with(함께), for(~을 위해) 등", 
                        role: "형용사 또는 부사 역할을 하도록 <b>구를 만드는 장치</b>",
                        example: "1. <b>형용사 역할</b>: The boy [<u>in the room</u>] is my friend. (그 방 안의 소년은 내 친구다.)<br>→ 명사 boy를 수식<br><br>2. <b>부사 역할(장소)</b>: She lives [<u>in Seoul</u>]. (그녀는 서울에 산다.)<br>→ 동사 lives를 수식<br><br>3. <b>부사 역할(시간)</b>: He came [<u>at night</u>]. (그는 밤에 왔다.)<br>→ 동사 came을 수식"
                    },
                    { 
                        term: "접속사(Conjunction)", 
                        def: "단어, 구, 절을 연결하는 <b>연결 고리</b>입니다.<br>• <b>등위접속사</b>: 같은 자격끼리 연결 (and, but, or, so)<br>• <b>종속접속사</b>: 한 절을 문장 안의 성분(명사, 형용사, 부사)으로 종속시켜 품사 역할을 하게 함", 
                        role: "문장 성분을 묶거나 변환하는 논리 연산자",
                        example: "1. <b>등위접속사 (대등 연결)</b><br>• 단어+단어: Tom <u>and</u> Jerry (톰과 제리)<br>• 구+구: <u>in the room</u> and <u>on the table</u> (방 안과 탁자 위)<br>• 절+절: I like coffee, <u>but</u> she likes tea. (커피를 좋아하지만 차를 좋아한다)<br><br>2. <b>종속접속사 (품사 역할 수행)</b><br>• <b>명사절</b> (~하는 것): I think <u>that</u> he is right. (그가 옳다고 생각한다)<br>• <b>형용사절</b> (명사 수식): The boy <u>who</u> is running is my brother. (달리고 있는 소년은 동생이다)<br>• <b>부사절</b> (이유/시간): I stayed home <u>because</u> it was raining. (비가 와서 집에 있었다)"
                    },
                    { 
                        term: "감탄사(Interjection)", 
                        def: "기쁨, 슬픔, 놀람 등의 감정을 즉각적으로 표현하는 말입니다.", 
                        role: "문장의 다른 성분과는 독립적으로 사용됨",
                        example: "1. <u>Wow</u>! The sunset is beautiful. (와! 노을이 아름답다.)<br>2. <u>Ouch</u>! It hurts. (아야! 아파요.)"
                    }
                ]
            },
            "components": {
                id: "components",
                title: "2. 문장 성분",
                subtitle: "재료(품사)가 문장 안에서 맡는 역할 (Roles)",
                items: [
                    { term: "Subject (주어 - S)", def: "동작의 주체 ('~은/는/이/가')", formula: "명사, 대명사, 명사구/절" },
                    { term: "Verb (동사/서술어 - V)", def: "주어의 동작이나 상태 ('~하다/이다')", formula: "동사" },
                    { term: "Object (목적어 - O)", def: "동작의 대상 ('~을/를')", formula: "명사, 대명사" },
                    { term: "Complement (보어 - C)", def: "주어나 목적어를 보충 설명", formula: "명사(동격), 형용사(상태)" },
                    { term: "Modifier (수식어 - M)", def: "문장의 필수 성분은 아니지만 의미를 풍부하게 함", formula: "형용사, 부사, 전명구" }
                ]
            },
            "structures": {
                id: "structures",
                title: "3. 문장의 5형식",
                subtitle: "영어 문장이 조립되는 5가지 절대 공식 (Formulas)",
                items: [
                    { term: "1형식", def: "완전 자동사", formula: "S + V (+ M)", note: "Birds fly. (새들은 난다)" },
                    { term: "2형식", def: "불완전 자동사", formula: "S + V + C", note: "He is happy. (그는 행복하다)" },
                    { term: "3형식", def: "완전 타동사", formula: "S + V + O", note: "I love coding. (나는 코딩을 사랑한다)" },
                    { term: "4형식", def: "수여 동사", formula: "S + V + I.O + D.O", note: "She gave me a gift. (그녀는 나에게 선물을 주었다)" },
                    { term: "5형식", def: "불완전 타동사", formula: "S + V + O + O.C", note: "They call him a hero. (그들은 그를 영웅이라 부른다)" }
                ]
            },
            "units": {
                id: "units",
                title: "4. 구와 절",
                subtitle: "단어의 확장 단위 (Extended Units)",
                items: [
                    { term: "Phrase (구)", def: "두 개 이상의 단어가 모여 하나의 품사 역할. (주어+동사 없음)", example: "in the room (전명구), to study hard (투부정사구)" },
                    { term: "Clause (절)", def: "두 개 이상의 단어가 모여 하나의 품사 역할. (주어+동사 있음)", example: "that he is rich (명사절), when I was young (부사절)" }
                ]
            }
        };

        let appState = {
            activeTab: "partsOfSpeech",
            memorizationMode: false,
            revealedItems: {}
        };

        function updateState(newState) {
            appState = { ...appState, ...newState };
            renderApp();
        }

        function switchTab(tabId) {
            updateState({ 
                activeTab: tabId, 
                revealedItems: {} 
            });
        }

        function toggleMode() {
            updateState({ 
                memorizationMode: !appState.memorizationMode,
                revealedItems: {} 
            });
        }

        function toggleReveal(index) {
            if (!appState.memorizationMode) return;
            const newRevealed = { ...appState.revealedItems };
            if (newRevealed[index]) {
                delete newRevealed[index];
            } else {
                newRevealed[index] = true;
            }
            updateState({ revealedItems: newRevealed });
        }

        function renderApp() {
            const app = document.getElementById('app');
            const currentData = grammarData[appState.activeTab];
            const isDrillMode = appState.memorizationMode;

            const headerHTML = `
                <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-10 transition-colors">
                    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="bg-blue-600 p-2 rounded-lg shadow-lg">
                                <i data-lucide="calculator" class="text-white w-6 h-6"></i>
                            </div>
                            <div>
                                <h1 class="text-lg sm:text-xl font-bold leading-tight">English Grammar Formulas</h1>
                                <p class="hidden sm:block text-xs text-slate-400 font-mono">Prerequisite for Logic & Composition</p>
                            </div>
                        </div>
                        
                        <button onclick="toggleMode()" 
                            class="flex items-center space-x-2 px-4 py-2 rounded-full transition-all duration-300 transform active:scale-95 ${isDrillMode ? 'bg-red-500 hover:bg-red-600 text-white shadow-red-200 shadow-md' : 'bg-slate-700 hover:bg-slate-600 text-slate-200'}">
                            <i data-lucide="${isDrillMode ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>
                            <span class="text-sm font-medium">${isDrillMode ? 'Drill Mode On' : 'Study Mode'}</span>
                        </button>
                    </div>
                </header>
            `;

            // [수정] 점 뒷부분에서 한글 제목만 가져오도록 파싱 로직 복구
            const tabsHTML = Object.values(grammarData).map(data => {
                const isActive = appState.activeTab === data.id;
                const cleanTitle = data.title.split('.')[1].split('(')[0].trim(); 
                return `
                    <button onclick="switchTab('${data.id}')"
                        class="flex-1 min-w-0 px-1 sm:px-4 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 truncate ${isActive ? 'bg-blue-600 text-white shadow-md transform scale-105 z-10' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}">
                        ${cleanTitle}
                    </button>
                `;
            }).join('');

            const cardsHTML = currentData.items.map((item, index) => {
                const isRevealed = appState.revealedItems[index];
                const showContent = !isDrillMode || isRevealed;

                let borderClass = "border-slate-100 shadow-sm hover:border-slate-300";
                if (isDrillMode) {
                    borderClass = isRevealed 
                        ? "border-green-500 shadow-md" 
                        : "border-slate-200 hover:border-blue-400 hover:shadow-lg cursor-pointer";
                }

                let iconHTML = '';
                if (isDrillMode && !isRevealed) {
                    iconHTML = `<span class="text-xs font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded flex items-center gap-1"><i data-lucide="mouse-pointer-click" class="w-3 h-3"></i> Click</span>`;
                } else if (isDrillMode && isRevealed) {
                    iconHTML = `<i data-lucide="check-circle" class="text-green-500 w-5 h-5"></i>`;
                }

                let contentHTML = '';
                if (showContent) {
                    let extraSectionsHTML = '';
                    if (item.role) {
                        extraSectionsHTML += `
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 mb-2">
                                <span class="text-xs font-bold text-blue-600 tracking-wider block mb-1">역할(Role)</span>
                                <div class="text-slate-900 font-mono text-sm break-keep leading-relaxed">${item.role}</div>
                            </div>
                        `;
                    }
                    if (item.formula) {
                        extraSectionsHTML += `
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 mb-2">
                                <span class="text-xs font-bold text-blue-600 tracking-wider block mb-1">공식(Formula)</span>
                                <div class="text-slate-900 font-mono text-sm break-keep leading-relaxed">${item.formula}</div>
                            </div>
                        `;
                    }
                    if (item.example) {
                        extraSectionsHTML += `
                            <div class="bg-blue-50 p-3 rounded-lg border border-blue-100 mb-2">
                                <span class="text-xs font-bold text-blue-700 tracking-wider block mb-1">예시(Example)</span>
                                <div class="text-slate-900 font-mono text-sm break-keep leading-relaxed">${item.example}</div>
                            </div>
                        `;
                    }
                    if (item.note) {
                        extraSectionsHTML += `<p class="text-slate-500 text-xs mt-1 italic">💡 ${item.note}</p>`;
                    }
                    contentHTML = `
                        <div class="space-y-3 fade-in">
                            <div>
                                <span class="text-xs font-bold text-slate-400 tracking-wider block mb-1">정의(Definition)</span>
                                <div class="text-slate-700 font-medium break-keep leading-snug">${item.def}</div>
                            </div>
                            ${extraSectionsHTML}
                        </div>
                    `;
                } else {
                    contentHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-slate-300 space-y-2 py-4">
                            <i data-lucide="brain" class="w-8 h-8 opacity-50"></i>
                            <span class="text-sm font-medium">정의를 떠올려보세요</span>
                        </div>
                    `;
                }

                return `
                    <div onclick="toggleReveal(${index})" class="relative group bg-white rounded-xl border-2 transition-all overflow-hidden ${borderClass}">
                        <div class="bg-slate-50 px-5 py-3 border-b border-slate-100 flex justify-between items-center">
                            <span class="font-bold text-slate-800 text-base sm:text-lg">${item.term}</span>
                            ${iconHTML}
                        </div>
                        <div class="p-5 min-h-[140px] flex flex-col justify-center">
                            ${contentHTML}
                        </div>
                    </div>
                `;
            }).join('');

            app.innerHTML = `
                ${headerHTML}
                <main class="max-w-4xl mx-auto px-4 mt-8">
                    <div class="bg-white border-l-4 border-blue-600 rounded-r-lg shadow-sm p-6 mb-8">
                        <h2 class="text-lg font-bold text-slate-900 mb-2 flex items-center gap-2">
                            <i data-lucide="book-open" class="w-5 h-5 text-blue-600"></i>
                            교수님의 학습 가이드
                        </h2>
                        <p class="text-slate-600 text-sm leading-relaxed">
                            영어 문법은 <strong>수학 공식</strong>과 같습니다. 문장의 논리적 어순을 이해하기 전에, 
                            이 페이지에 있는 <strong>기본 용어(Variables)</strong>와 <strong>공식(Functions)</strong>을 
                            구구단처럼 먼저 암기해야 합니다. 우측 상단의 <strong class="text-slate-800">'Drill Mode'</strong>를 켜고 빈칸을 스스로 채워보세요.
                        </p>
                    </div>
                    <div class="flex flex-nowrap gap-1 sm:gap-2 mb-6 scrollbar-hide">
                        ${tabsHTML}
                    </div>
                    <div class="fade-in">
                        <div class="mb-6">
                            <h2 class="text-2xl font-bold text-slate-800">${currentData.title}</h2>
                            <p class="text-slate-500 mt-1">${currentData.subtitle}</p>
                        </div>
                        <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-2">
                            ${cardsHTML}
                        </div>
                    </div>
                </main>
                <footer class="max-w-4xl mx-auto px-4 mt-12 text-center text-slate-400 text-sm pb-8">
                    <p>© 2026. Designed for Logical Grammar Learning.</p>
                </footer>
            `;
            lucide.createIcons();
        }
        renderApp();
    </script>
</body>
</html>
