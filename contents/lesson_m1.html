                        def: "전치사, 접속사, 감탄사 역시 여러 단어가 뭉쳐 <b>하나의 품사</b>처럼 작동할 수 있습니다.", 
                        role: "문장의 논리적 연결과 감정 표현을 담당하는 <b>기능적 모듈</b>입니다.",
                        example: "1. <b>전치사구</b>: The dog is <u>in front of</u> the house. (그 개는 집 앞에 있다)<br>→ 'in front of' 3단어가 하나의 <b>전치사</b> 역할<br>2. <b>접속사구</b>: <u>As soon as</u> I arrived, the class started. (내가 도착하자마자 수업이 시작되었다)<br>→ 'As soon as' 3단어가 하나의 <b>접속사</b> 역할<br>3. <b>감탄사구</b>: <u>Oh my goodness</u>! That dog is big. (어머나! 저 개는 정말 크다)<br>→ 3단어가 하나의 <b>감탄사</b> 역할"
                    },
                    { 
                        term: "절 (Clause) 체계", 
                        def: "두 개 이상의 단어가 모여 <b>주어+동사(S+V)를 갖추고</b> 하나의 품사 역할을 하는 덩어리입니다.", 
                        role: "접속사는 크게 두 종류로 나뉩니다.<br>• <b>등위접속사</b>: and, but, or, so, for (앞뒤 대등 연결)<br>• <b>종속접속사</b>: 절을 문장의 한 성분(명사, 형용사, 부사)으로 만들어 전체 핵심내용을 나타내는 문장인 주절에 종속시킴",
                        example: "종속접속사가 이끄는 절은 접속사부터 절 끝까지의 단어 덩어리가 하나의 품사 역할을 수행하기 때문에 문장에서 각 품사의 기능을 수행합니다.<br>• <b>명사절</b>: 주어, 보어, 목적어 역할<br>• <b>형용사절</b>: 명사 뒤에서 앞의 명사(선행사) 수식<br>• <b>부사절</b>: 문장 앞이나 뒤에서 서술어(동사) 수식"
                    },
                    { 
                        term: "① 명사절 (Noun Clause)", 
                        def: "문장에서 <b>주어, 목적어, 보어</b> 역할을 하는 S+V 덩어리입니다.", 
                        role: "• <b>that</b>: ~라는 것<br>• <b>whether/if</b>: ~인지 아닌지<br>• <b>의문사</b>: who, what, when, where, how, why 등 (각 의문사의 뜻)",
                        example: "I think <u>that he is right</u>. (나는 <b>그가 옳다는 것</b>을 생각한다 / 목적어 역할)"
                    },
                    { 
                        term: "② 형용사절 (Adjective Clause)", 
                        def: "앞에 있는 명사(선행사)를 수식하는 S+V 덩어리입니다. <b>관계사절</b>이라고도 부릅니다.", 
                        role: "• <b>관계대명사</b>: who, which, that<br>• <b>관계부사</b>: where, when, why, how",
                        example: "The boy <u>who is running</u> is my brother. (<b>달리고 있는</b> 그 소년은 내 동생이다 / 명사 boy 수식)"
                    },
                    { 
                        term: "③ 부사절 (Adverb Clause)", 
                        def: "문장의 <b>동사</b>를 수식하여 시간, 이유, 조건 등을 설명하는 S+V 덩어리입니다.", 
                        role: "• <b>if</b> (만약), <b>because</b> (때문에), <b>when</b> (때), <b>before/after</b> (전/후) 등",
                        example: "I stayed home <u><b>because</b> it was raining</u>. (비가 왔기 때문에 나는 집에 있었다 / 동사 stayed 수식)"
                    }
                ]
            },
            "structures": {
                id: "structures",
                title: "4. 문장의 5형식 (The 5 Sentence Structures)",
                subtitle: "영어 문장이 조립되는 5가지 절대 공식 (Formulas)",
                items: [
                    { 
                        term: "1형식 (S + V)", 
                        def: "주어와 서술어만으로 완전한 의미를 전달하는 구조입니다.", 
                        role: "추가 부품이 필요 없는 <b>완전자동사</b> 모델",
                        example: "<b>L0 (단문)</b>: Birds fly. (새들은 난다)<br><b>L1 (수식어)</b>: Many birds fly high. (많은 새들이 높이 난다)<br><b>L2 (구 확장)</b>: Birds <u>in the sky</u> fly <u>to the tree</u>. (하늘에 있는 새들이 나무로 날아간다)<br><b>L3 (절 확장)</b>: Birds fly <u>when spring comes</u>. (봄이 오면 새들이 난다)"
                    },
                    { 
                        term: "2형식 (S + V + C)", 
                        def: "주어의 신분이나 상태를 보충하는 보어(C)가 필요한 구조입니다.", 
                        role: "S = C 관계가 성립하는 <b>상태 기술</b> 모델",
                        example: "<b>L0 (단문)</b>: He is a doctor. (그는 의사이다)<br><b>L1 (수식어)</b>: The young man is a great doctor. (그 젊은 남자는 훌륭한 의사이다)<br><b>L2 (구 확장)</b>: The man <u>in our town</u> is a doctor <u>for kids</u>. (우리 마을의 그 남자는 아이들을 위한 의사이다)<br><b>L3 (절 확장)</b>: He is a doctor <u>who helps people</u>. (그는 사람들을 돕는 의사이다)"
                    },
                    { 
                        term: "3형식 (S + V + O)", 
                        def: "동작의 대상인 목적어(O)가 필요한 구조입니다.", 
                        role: "동작의 에너지가 대상에 도달하는 <b>완전타동사</b> 모델",
                        example: "<b>L0 (단문)</b>: I like pizza. (나는 피자를 좋아한다)<br><b>L1 (수식어)</b>: I really like delicious pizza. (나는 정말 맛있는 피자를 좋아한다)<br><b>L2 (구 확장)</b>: I like pizza <u>with lots of cheese</u>. (나는 치즈가 많이 들어간 피자를 좋아한다)<br><b>L3 (절 확장)</b>: I like pizza <u>that you made yesterday</u>. (나는 네가 어제 만든 피자를 좋아한다)"
                    },
                    { 
                        term: "4형식 (S + V + I.O + D.O)", 
                        def: "수여 대상(~에게)과 수여 내용(~을)을 가지는 구조입니다.", 
                        role: "누군가에게 무언가를 주는 <b>수여동사</b> 모델",
                        example: "<b>L0 (단문)</b>: He gave me a book. (그는 나에게 책을 주었다)<br><b>L1 (수식어)</b>: My friend gave me an interesting book. (내 친구가 나에게 흥미로운 책을 주었다)<br><b>L2 (구 확장)</b>: He gave me a book <u>about drones</u>. (그는 나에게 드론에 관한 책을 주었다)<br><b>L3 (절 확장)</b>: He gave me the book <u>which I wanted to read</u>. (그는 내가 읽고 싶었던 그 책을 주었다)"
                    },
                    { 
                        term: "5형식 (S + V + O + O.C)", 
                        def: "목적어의 상태나 동작을 보충하는 목적격보어(O.C)가 필요한 구조입니다.", 
                        role: "목적어의 변화나 속성을 정의하는 <b>불완전타동사</b> 모델",
                        example: "<b>L0 (단문)</b>: You make me happy. (너는 나를 행복하게 만든다)<br><b>L1 (수식어)</b>: Your kind words make me very happy. (너의 친절한 말들이 나를 매우 행복하게 만든다)<br><b>L2 (구 확장)</b>: Traveling <u>with you</u> makes me happy. (너와 여행하는 것은 나를 행복하게 만든다)<br><b>L3 (절 확장)</b>: You make me happy <u>because you always smile</u>. (네가 항상 웃기 때문에 너는 나를 행복하게 만든다)"
                    }
                ]
            }
        };

        let appState = {
            activeTab: "partsOfSpeech",
            memorizationMode: false,
            revealedItems: {}
        };

        function updateState(newState) {
            appState = { ...appState, ...newState };
            renderApp();
        }

        function switchTab(tabId) {
            updateState({ 
                activeTab: tabId, 
                revealedItems: {} 
            });
        }

        function toggleMode() {
            updateState({ 
                memorizationMode: !appState.memorizationMode,
                revealedItems: {} 
            });
        }

        function toggleReveal(index) {
            if (!appState.memorizationMode) return;
            const newRevealed = { ...appState.revealedItems };
            if (newRevealed[index]) {
                delete newRevealed[index];
            } else {
                newRevealed[index] = true;
            }
            updateState({ revealedItems: newRevealed });
        }

        function renderApp() {
            const app = document.getElementById('app');
            const currentData = grammarData[appState.activeTab];
            const isDrillMode = appState.memorizationMode;

            const headerHTML = `
                <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-10 transition-colors">
                    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="bg-blue-600 p-2 rounded-lg shadow-lg">
                                <i data-lucide="calculator" class="text-white w-6 h-6"></i>
                            </div>
                            <div>
                                <h1 class="text-lg sm:text-xl font-bold leading-tight">English Grammar Formulas</h1>
                                <p class="hidden sm:block text-xs text-slate-400 font-mono">Prerequisite for Logic & Composition</p>
                            </div>
                        </div>
                        
                        <button onclick="toggleMode()" 
                            class="flex items-center space-x-2 px-4 py-2 rounded-full transition-all duration-300 transform active:scale-95 ${isDrillMode ? 'bg-red-500 hover:bg-red-600 text-white shadow-red-200 shadow-md' : 'bg-slate-700 hover:bg-slate-600 text-slate-200'}">
                            <i data-lucide="${isDrillMode ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>
                            <span class="text-sm font-medium">${isDrillMode ? 'Drill Mode On' : 'Study Mode'}</span>
                        </button>
                    </div>
                </header>
            `;

            const tabsHTML = Object.values(grammarData).map(data => {
                const isActive = appState.activeTab === data.id;
                const cleanTitle = data.title.split('.')[1].split('(')[0].trim(); 
                return `
                    <button onclick="switchTab('${data.id}')"
                        class="flex-1 min-w-0 px-1 sm:px-4 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition-all duration-200 truncate ${isActive ? 'bg-blue-600 text-white shadow-md transform scale-105 z-10' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}">
                        ${cleanTitle}
                    </button>
                `;
            }).join('');

            const cardsHTML = currentData.items.map((item, index) => {
                const isRevealed = appState.revealedItems[index];
                const showContent = !isDrillMode || isRevealed;

                let borderClass = "border-slate-100 shadow-sm hover:border-slate-300";
                if (isDrillMode) {
                    borderClass = isRevealed 
                        ? "border-green-500 shadow-md" 
                        : "border-slate-200 hover:border-blue-400 hover:shadow-lg cursor-pointer";
                }

                let iconHTML = '';
                if (isDrillMode && !isRevealed) {
                    iconHTML = `<span class="text-xs font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded flex items-center gap-1"><i data-lucide="mouse-pointer-click" class="w-3 h-3"></i> Click</span>`;
                } else if (isDrillMode && isRevealed) {
                    iconHTML = `<i data-lucide="check-circle" class="text-green-500 w-5 h-5"></i>`;
                }

                let contentHTML = '';
                if (showContent) {
                    let extraSectionsHTML = '';
                    if (item.role) {
                        extraSectionsHTML += `
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 mb-2">
                                <span class="text-xs font-bold text-blue-600 tracking-wider block mb-1">역할(Role)</span>
                                <div class="text-slate-900 font-mono text-sm break-keep leading-relaxed">${item.role}</div>
                            </div>
                        `;
                    }
                    if (item.formula) {
                        extraSectionsHTML += `
                            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 mb-2">
                                <span class="text-xs font-bold text-blue-600 tracking-wider block mb-1">공식(Formula)</span>
                                <div class="text-slate-900 font-mono text-sm break-keep leading-relaxed">${item.formula}</div>
                            </div>
                        `;
                    }
                    if (item.example) {
                        extraSectionsHTML += `
                            <div class="bg-blue-50 p-3 rounded-lg border border-blue-100 mb-2">
                                <span class="text-xs font-bold text-blue-700 tracking-wider block mb-1">예시(Example)</span>
                                <div class="text-slate-900 font-mono text-sm break-keep leading-relaxed">${item.example}</div>
                            </div>
                        `;
                    }
                    if (item.note) {
                        extraSectionsHTML += `<p class="text-slate-500 text-xs mt-1 italic">💡 ${item.note}</p>`;
                    }
                    
                    contentHTML = `
                        <div class="space-y-3 fade-in">
                            <div>
                                <span class="text-xs font-bold text-slate-400 tracking-wider block mb-1">정의(Definition)</span>
                                <div class="text-slate-700 font-medium break-keep leading-snug">${item.def}</div>
                            </div>
                            ${extraSectionsHTML}
                        </div>
                    `;
                } else {
                    contentHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-slate-300 space-y-2 py-4">
                            <i data-lucide="brain" class="w-8 h-8 opacity-50"></i>
                            <span class="text-sm font-medium">정의를 떠올려보세요</span>
                        </div>
                    `;
                }

                return `
                    <div onclick="toggleReveal(${index})" class="relative group bg-white rounded-xl border-2 transition-all overflow-hidden ${borderClass}">
                        <div class="bg-slate-50 px-5 py-3 border-b border-slate-100 flex justify-between items-center">
                            <span class="font-bold text-slate-800 text-base sm:text-lg">${item.term}</span>
                            ${iconHTML}
                        </div>
                        <div class="p-5 min-h-[140px] flex flex-col justify-center">
                            ${contentHTML}
                        </div>
                    </div>
                `;
            }).join('');

            app.innerHTML = `
                ${headerHTML}
                <main class="max-w-4xl mx-auto px-4 mt-8">
                    <div class="bg-white border-l-4 border-blue-600 rounded-r-lg shadow-sm p-6 mb-8 transition-all hover:shadow-md">
                        <h2 class="text-lg font-bold text-slate-900 mb-2 flex items-center gap-2">
                            <i data-lucide="book-open" class="w-5 h-5 text-blue-600"></i>
                            토니샘의 학습 가이드
                        </h2>
                        <p class="text-slate-600 text-sm leading-relaxed">
                            영어 문법은 <strong>수학 공식</strong>과 같습니다. 문장의 논리적 어순을 이해하기 전에, 
                            이 페이지에 있는 <strong>기본 용어(Variables)</strong>와 <strong>공식(Functions)</strong>을 
                            구구단처럼 먼저 암기해야 합니다. 우측 상단의 <strong class="text-slate-800">'Drill Mode'</strong>를 켜고 빈칸을 스스로 채워보세요.
                        </p>
                    </div>

                    <div class="flex flex-nowrap gap-1 sm:gap-2 mb-6 scrollbar-hide">
                        ${tabsHTML}
                    </div>

                    <div class="fade-in">
                        <div class="mb-6">
                            <h2 class="text-2xl font-bold text-slate-800">${currentData.title}</h2>
                            <p class="text-slate-500 mt-1 text-sm sm:text-base">${currentData.subtitle}</p>
                        </div>
                        <div class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-2">
                            ${cardsHTML}
                        </div>
                    </div>
                </main>

                <footer class="max-w-4xl mx-auto px-4 mt-12 text-center text-slate-400 text-sm pb-8">
                    <p>© 2026. Designed for Logical Grammar Learning.</p>
                </footer>
            `;

            lucide.createIcons();
        }

        renderApp();
    </script>
</body>
</html>
