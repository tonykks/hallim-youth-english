<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar CHECK CHECK - 일반동사</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        :root {
            --fs-lg: clamp(1.06rem, 0.98rem + 0.35vw, 1.2rem);
            --fs-md: clamp(0.96rem, 0.9rem + 0.2vw, 1.05rem);
            --fs-sm: clamp(0.86rem, 0.82rem + 0.18vw, 0.94rem);
        }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .content-shell { width: min(100% - 1rem, 1180px); margin-inline: auto; }
        .lesson-root { font-size: var(--fs-md); line-height: 1.6; }
        .lesson-root .font-serif,
        .lesson-root .font-mono { font-family: 'Noto Sans KR', sans-serif !important; }
        .lesson-root [class*="text-[9px]"],
        .lesson-root [class*="text-[10px]"],
        .lesson-root [class*="text-[11px]"],
        .lesson-root .text-xs { font-size: var(--fs-sm) !important; line-height: 1.45 !important; }
        .lesson-root .text-sm { font-size: var(--fs-md) !important; line-height: 1.55 !important; }
        .lesson-root .text-lg { font-size: var(--fs-lg) !important; line-height: 1.45 !important; }
        .quiz-btn { transition: all 0.2s; }
                .lesson-root .listen-short { display: none; }
        .sentence-box { transition: all 0.2s; border: 1px solid #e2e8f0; }
        .sentence-box:hover { background-color: #ffffff; transform: translateX(3px); border-color: #93c5fd; box-shadow: 0 4px 8px -2px rgb(0 0 0 / 0.12); }
        @media (max-width: 768px) {
            :root {
                --fs-lg: clamp(0.84rem, 0.8rem + 0.2vw, 0.9rem);
                --fs-md: clamp(0.76rem, 0.74rem + 0.16vw, 0.82rem);
                --fs-sm: clamp(0.7rem, 0.68rem + 0.14vw, 0.76rem);
            }
            .content-shell { width: min(100% - 0.6rem, 1180px); }
            .lesson-root section { border-radius: 1.75rem !important; }
            .lesson-root h1 { font-size: 0.96rem !important; line-height: 1.35 !important; }
            .lesson-root h2 { font-size: 0.92rem !important; line-height: 1.35 !important; }
            .lesson-root h3 { font-size: 0.88rem !important; line-height: 1.4 !important; }
            .lesson-root h4 { font-size: 0.84rem !important; line-height: 1.42 !important; }
            .lesson-root [class*="text-3xl"] { font-size: 0.96rem !important; line-height: 1.35 !important; }
            .lesson-root [class*="text-2xl"] { font-size: 0.9rem !important; line-height: 1.38 !important; }
            .lesson-root [class*="text-xl"] { font-size: 0.84rem !important; line-height: 1.4 !important; }
            .lesson-root [class*="text-lg"] { font-size: 0.8rem !important; line-height: 1.45 !important; }
            .lesson-root [class*="p-10"] { padding: 1.5rem !important; }
            .lesson-root [class*="p-8"] { padding: 1.25rem !important; }
            .lesson-root [class*="p-6"] { padding: 1rem !important; }
            .lesson-root [class*="gap-8"] { gap: 1rem !important; }
            .lesson-root [class*="gap-6"] { gap: 0.85rem !important; }
            .lesson-root .overflow-x-auto { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .lesson-root .overflow-x-auto > table { min-width: 700px; table-layout: auto; }
            .lesson-root th,
            .lesson-root td {
                padding: 0.56rem 0.44rem !important;
                line-height: 1.38 !important;
                white-space: normal;
                word-break: keep-all;
                overflow-wrap: break-word;
            }
            .lesson-root thead th { font-size: 0.68rem !important; }
            .lesson-root tbody td { font-size: 0.74rem !important; }
            .lesson-root p,
            .lesson-root li,
            .lesson-root span,
            .lesson-root button { line-height: 1.52; font-size: 0.76rem; }
        }
        @media (max-width: 480px) {
            .lesson-root .listen-long { display: none; }
            .lesson-root .listen-short { display: inline; }
            .lesson-root .quiz-btn {
                min-height: 2.1rem;
                width: auto !important;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 0.74rem !important;
                line-height: 1.2 !important;
                white-space: nowrap;
                word-break: keep-all;
                overflow-wrap: normal;
                padding: 0.42rem 0.55rem !important;
            }
            .lesson-root .grid.grid-cols-2.md\:grid-cols-4.gap-4 {
                display: flex !important;
                flex-wrap: wrap;
                align-items: flex-start;
                justify-content: flex-start;
                gap: 0.45rem !important;
            }
            .lesson-root .grid.grid-cols-2.md\:grid-cols-4.gap-4 > * {
                flex: 0 0 auto;
                width: auto;
            }
            .lesson-root [class*="mb-10"] { margin-bottom: 0.95rem !important; }
            .lesson-root [class*="mb-8"] { margin-bottom: 0.72rem !important; }
            .lesson-root [class*="mb-6"] { margin-bottom: 0.56rem !important; }
            .lesson-root [class*="mb-4"] { margin-bottom: 0.44rem !important; }
            .lesson-root [class*="mb-3"] { margin-bottom: 0.36rem !important; }
            .lesson-root [class*="mb-2"] { margin-bottom: 0.3rem !important; }
            .lesson-root [class*="mt-20"] { margin-top: 1.5rem !important; }
            .lesson-root [class*="mt-8"] { margin-top: 0.78rem !important; }
            .lesson-root [class*="mt-6"] { margin-top: 0.62rem !important; }
            .lesson-root [class*="mt-4"] { margin-top: 0.48rem !important; }
            .lesson-root [class*="mt-3"] { margin-top: 0.4rem !important; }
            .lesson-root [class*="mt-2"] { margin-top: 0.28rem !important; }
        }
        @media (max-width: 400px) {
            .lesson-root .overflow-x-auto > table { min-width: 680px; }
            .lesson-root h1 { font-size: 0.9rem !important; }
            .lesson-root h2 { font-size: 0.86rem !important; }
            .lesson-root h3 { font-size: 0.82rem !important; }
            .lesson-root h4 { font-size: 0.8rem !important; }
            .lesson-root [class*="text-3xl"] { font-size: 0.9rem !important; }
            .lesson-root [class*="text-2xl"] { font-size: 0.85rem !important; }
            .lesson-root [class*="p-10"] { padding: 1.2rem !important; }
            .lesson-root [class*="p-8"] { padding: 1rem !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icons = {
            Zap: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.71 14.71 4H20v5.29L9.29 20H4z"/><path d="m15.5 6.5 2 2"/></svg>,
            Microscope: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></svg>,
            Volume2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
            PlayCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>,
            CheckCircle2: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10Z"/><path d="m9 12 2 2 4-4"/></svg>
        };

        const presentQuiz = [
            { category: "현재형", q: "My sister (   ) horror movies very much.", ko: "내 여동생은 공포 영화를 매우 좋아한다.", options: ["like", "likes", "liking", "liked"], ansIdx: 1, answer: "My sister likes horror movies very much.", reason: "3인칭 단수(My sister) + 현재형이므로 동사에 -s를 붙입니다." },
            { category: "현재형", q: "Todd (   ) his bike by himself.", ko: "토드는 혼자서 자전거를 고친다.", options: ["fix", "fixes", "fixed", "fixing"], ansIdx: 1, answer: "Todd fixes his bike by himself.", reason: "3인칭 단수 주어이며 x로 끝나므로 -es를 붙입니다." },
            { category: "현재형", q: "Mike and I (   ) to school by bus.", ko: "마이크와 나는 버스로 학교에 간다.", options: ["go", "goes", "going", "went"], ansIdx: 0, answer: "Mike and I go to school by bus.", reason: "복수 주어(Mike and I)이므로 동사원형을 씁니다." },
            { category: "현재형", q: "The baby (   ) like an angel.", ko: "그 아기는 천사처럼 보인다.", options: ["look", "looks", "looked", "looking"], ansIdx: 1, answer: "The baby looks like an angel.", reason: "3인칭 단수(The baby)이므로 looks가 맞습니다." },
            { category: "현재형", q: "Children often (   ) new things.", ko: "아이들은 자주 새로운 것을 시도한다.", options: ["try", "tries", "trying", "tried"], ansIdx: 0, answer: "Children often try new things.", reason: "복수 주어(Children)이므로 동사원형을 씁니다." },
            { category: "현재형", q: "We (   ) our dogs every day.", ko: "우리는 매일 우리 개를 산책시킨다.", options: ["walk", "walks", "walking", "walked"], ansIdx: 0, answer: "We walk our dogs every day.", reason: "We는 복수 주어이므로 동사원형 walk를 씁니다." },
            { category: "현재형", q: "Robin (   ) an old camera.", ko: "로빈은 오래된 카메라를 가지고 있다.", options: ["have", "has", "having", "had"], ansIdx: 1, answer: "Robin has an old camera.", reason: "have는 3인칭 단수에서 has로 변합니다." },
            { category: "현재형", q: "She (   ) her face before breakfast.", ko: "그녀는 아침 식사 전에 세수한다.", options: ["wash", "washes", "washed", "washing"], ansIdx: 1, answer: "She washes her face before breakfast.", reason: "3인칭 단수 + sh 끝 동사이므로 -es를 붙입니다." },
            { category: "현재형", q: "The cook (   ) all the vegetables.", ko: "요리사는 모든 채소를 섞는다.", options: ["mix", "mixes", "mixed", "mixing"], ansIdx: 1, answer: "The cook mixes all the vegetables.", reason: "3인칭 단수(The cook)이므로 mixes를 씁니다." },
            { category: "현재형", q: "Their sister (   ) computer games.", ko: "그들의 여자 형제는 컴퓨터 게임을 즐긴다.", options: ["enjoy", "enjoys", "enjoyed", "enjoying"], ansIdx: 1, answer: "Their sister enjoys computer games.", reason: "3인칭 단수 주어이므로 enjoys가 정답입니다." }
        ];

        const negativeQuiz = [
            { category: "부정문", q: "We (   ) know each other.", ko: "우리는 서로를 알지 못한다.", options: ["do not", "does not", "are not", "is not"], ansIdx: 0, answer: "We do not know each other.", reason: "복수 주어 We는 do not을 씁니다." },
            { category: "부정문", q: "My cousin (   ) dance well.", ko: "내 사촌은 춤을 잘 추지 못한다.", options: ["do not", "does not", "is not", "are not"], ansIdx: 1, answer: "My cousin does not dance well.", reason: "3인칭 단수(My cousin)는 does not을 씁니다." },
            { category: "부정문", q: "Eddie and I (   ) have cell phones.", ko: "에디와 나는 휴대전화를 가지고 있지 않다.", options: ["do not", "does not", "is not", "are not"], ansIdx: 0, answer: "Eddie and I do not have cell phones.", reason: "Eddie and I는 복수 주어이므로 do not입니다." },
            { category: "부정문", q: "I like science. → I (   ) science.", ko: "나는 과학을 좋아하지 않는다.", options: ["do not like", "does not like", "am not like", "is not like"], ansIdx: 0, answer: "I do not like science.", reason: "I 주어의 일반동사 부정은 do not + 동사원형입니다." },
            { category: "부정문", q: "He speaks French. → He (   ) French.", ko: "그는 프랑스어를 말하지 않는다.", options: ["do not speak", "does not speak", "does not speaks", "is not speak"], ansIdx: 1, answer: "He does not speak French.", reason: "does가 오면 speak로 원형이 됩니다." },
            { category: "부정문", q: "We want ice cream. → We (   ) ice cream.", ko: "우리는 아이스크림을 원하지 않는다.", options: ["do not want", "does not want", "are not want", "is not want"], ansIdx: 0, answer: "We do not want ice cream.", reason: "복수 주어 We는 do not을 씁니다." },
            { category: "부정문", q: "It has a long tail. → It (   ) a long tail.", ko: "그것은 긴 꼬리를 가지고 있지 않다.", options: ["do not have", "does not have", "does not has", "is not have"], ansIdx: 1, answer: "It does not have a long tail.", reason: "has의 부정은 does not have입니다." },
            { category: "부정문", q: "They live in Korea. → They (   ) in Korea.", ko: "그들은 한국에 살지 않는다.", options: ["do not live", "does not live", "are not live", "is not live"], ansIdx: 0, answer: "They do not live in Korea.", reason: "They는 복수 주어이므로 do not live가 맞습니다." },
            { category: "부정문", q: "Julia (   ) two sisters.", ko: "줄리아는 자매가 두 명 있지 않다.", options: ["do not have", "does not have", "does not has", "is not have"], ansIdx: 1, answer: "Julia does not have two sisters.", reason: "3인칭 단수 Julia는 does not + have를 씁니다." },
            { category: "부정문", q: "Your school (   ) a cafeteria.", ko: "너의 학교에는 구내식당이 없다.", options: ["do not have", "does not have", "does not has", "are not have"], ansIdx: 1, answer: "Your school does not have a cafeteria.", reason: "학교 하나를 가리키는 3인칭 단수 주어입니다." }
        ];

        const questionQuiz = [
            { category: "의문문", q: "(   ) you play baseball?", ko: "너는 야구를 하니?", options: ["Do", "Does", "Are", "Is"], ansIdx: 0, answer: "Do you play baseball?", reason: "You 주어는 do로 시작합니다." },
            { category: "의문문", q: "(   ) your dad wear glasses?", ko: "너의 아빠는 안경을 쓰니?", options: ["Do", "Does", "Are", "Is"], ansIdx: 1, answer: "Does your dad wear glasses?", reason: "your dad는 3인칭 단수라서 does를 씁니다." },
            { category: "의문문", q: "You play soccer. → (   ) you play soccer?", ko: "너는 축구를 하니?", options: ["Do", "Does", "Are", "Is"], ansIdx: 0, answer: "Do you play soccer?", reason: "2인칭 you는 do 의문문 형태입니다." },
            { category: "의문문", q: "He walks to school. → (   ) he walk to school?", ko: "그는 학교에 걸어가니?", options: ["Do", "Does", "Are", "Is"], ansIdx: 1, answer: "Does he walk to school?", reason: "does가 앞으로 오면 walk로 원형이 됩니다." },
            { category: "의문문", q: "Cheetahs run fast. → (   ) cheetahs run fast?", ko: "치타들은 빠르게 달리니?", options: ["Do", "Does", "Are", "Is"], ansIdx: 0, answer: "Do cheetahs run fast?", reason: "복수 명사 cheetahs는 do를 씁니다." },
            { category: "의문문", q: "Mia's father works in a school. → (   ) Mia's father work in a school?", ko: "미아의 아버지는 학교에서 일하시니?", options: ["Do", "Does", "Are", "Is"], ansIdx: 1, answer: "Does Mia's father work in a school?", reason: "3인칭 단수 주어이므로 does가 맞습니다." },
            { category: "의문문", q: "The library closes at 9 p.m. → (   ) the library close at 9 p.m.?", ko: "도서관은 오후 9시에 닫니?", options: ["Do", "Does", "Are", "Is"], ansIdx: 1, answer: "Does the library close at 9 p.m.?", reason: "library는 단수 명사이므로 does를 씁니다." },
            { category: "의문문", q: "A: Do you swim well? B: No, I (   ).", ko: "A: 너 수영 잘하니? B: 아니, 못해.", options: ["don't", "doesn't", "am not", "isn't"], ansIdx: 0, answer: "A: Do you swim well? B: No, I don't.", reason: "Do 질문의 부정 대답은 don't입니다." },
            { category: "의문문", q: "A: Does Mr. Davis teach English? B: Yes, he (   ).", ko: "A: 데이비스 선생님은 영어를 가르치시니? B: 네, 그래요.", options: ["do", "does", "is", "are"], ansIdx: 1, answer: "A: Does Mr. Davis teach English? B: Yes, he does.", reason: "Does 질문의 긍정 대답은 does입니다." },
            { category: "의문문", q: "A: Do Mark and Emma have blue eyes? B: Yes, they (   ).", ko: "A: 마크와 엠마는 파란 눈이니? B: 네, 그래.", options: ["do", "does", "are", "is"], ansIdx: 0, answer: "A: Do Mark and Emma have blue eyes? B: Yes, they do.", reason: "복수 주어 they의 짧은 대답은 do입니다." }
        ];

        const allQuizMaster = [...presentQuiz, ...negativeQuiz, ...questionQuiz];

        const shuffleArray = (arr) => [...arr].sort(() => Math.random() - 0.5);
        const buildQuizSequence = () => {
            const present = shuffleArray(allQuizMaster.filter((q) => q.category === "현재형"));
            const negative = shuffleArray(allQuizMaster.filter((q) => q.category === "부정문"));
            const question = shuffleArray(allQuizMaster.filter((q) => q.category === "의문문"));
            return [...present, ...negative, ...question];
        };

        const App = () => {
            const [quizIndex, setQuizIndex] = useState(0);
            const [quizFeedback, setQuizFeedback] = useState("");
            const [shuffledQuiz, setShuffledQuiz] = useState([]);
            const [isCorrect, setIsCorrect] = useState(false);

            const speak = (text) => {
                if ("speechSynthesis" in window) {
                    window.speechSynthesis.cancel();
                    const uttr = new SpeechSynthesisUtterance(text);
                    uttr.lang = "en-US";
                    uttr.rate = 0.88;
                    window.speechSynthesis.speak(uttr);
                }
            };

            useEffect(() => {
                setShuffledQuiz(buildQuizSequence());
            }, []);

            const handleAnswer = (clickedIdx) => {
                if (isCorrect) return;
                const current = shuffledQuiz[quizIndex];
                if (clickedIdx === current.ansIdx) {
                    setIsCorrect(true);
                    setQuizFeedback(`정답입니다! ${current.reason}`);
                    speak(current.answer);
                    return;
                }
                setIsCorrect(false);
                setQuizFeedback("다시 생각해보세요. 주어의 인칭/수를 먼저 판단하면 빠르게 해결됩니다.");
            };

            const nextQuestion = () => {
                if (quizIndex < shuffledQuiz.length - 1) {
                    setQuizIndex(quizIndex + 1);
                    setQuizFeedback("");
                    setIsCorrect(false);
                    return;
                }
                setQuizFeedback("30문제를 모두 완료했습니다. 다시 도전해도 좋습니다.");
            };

            const restartQuiz = () => {
                setShuffledQuiz(buildQuizSequence());
                setQuizIndex(0);
                setQuizFeedback("");
                setIsCorrect(false);
            };

            const currentQ = shuffledQuiz[quizIndex];
            const speakingSentences = useMemo(
                () => allQuizMaster.map((item) => ({ en: item.answer, ko: item.ko })),
                []
            );

            return (
                <div className="lesson-root min-h-screen bg-slate-50 text-slate-900 pb-12 overflow-x-hidden antialiased">
                    <header className="bg-white border-b sticky top-0 z-50 shadow-sm px-4 py-4">
                        <div className="content-shell flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-600 text-white p-2 rounded-xl shadow-lg shadow-blue-100">
                                    <Icons.Zap />
                                </div>
                                <div className="text-left">
                                    <h1 className="text-2xl font-black tracking-tighter italic leading-none">Grammar CHECK CHECK</h1>
                                    <span className="text-blue-600 font-black text-xs mt-1 block tracking-tight italic">중학영어 1-A / Lesson 2. She Likes Apples.</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="content-shell p-4 md:p-6 space-y-8">
                        <section className="bg-white rounded-[3rem] p-8 md:p-10 shadow-2xl border border-slate-100 text-left">
                            <h2 className="text-3xl font-black text-slate-800 italic mb-8 underline decoration-blue-100 underline-offset-8">일반동사 핵심 정리</h2>
                            <div className="grid md:grid-cols-2 gap-6">
                                <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                                    <h3 className="text-xl font-black text-slate-800 mb-3">1. 일반동사란?</h3>
                                    <p className="text-sm font-bold text-slate-600 leading-relaxed italic">
                                        be동사(am/is/are)를 제외한 대부분의 동사입니다.
                                        <br />예: come, go, study, play, have, know, fix, watch
                                    </p>
                                    <div className="mt-4 bg-white p-5 rounded-2xl border-l-4 border-blue-400 shadow-sm">
                                        <p className="text-sm font-bold text-slate-800">현재형은 "지금 딱 한 번"이 아니라 습관, 반복, 일반적 사실을 말할 때 씁니다.</p>
                                        <div className="mt-4 pt-4 border-t border-slate-100">
                                            <p className="font-black text-blue-700 italic text-xl">I go to school. (나는 학교에 갑니다.)</p>
                                            <p className="text-lg mt-3 leading-relaxed text-slate-700 font-medium">
                                                이 문장에서 일반동사 <strong className="text-blue-600">go</strong>는 현재형이므로 이 뜻은 과거에도, 오늘도, 앞으로도 특별한 변화가 없는 한 똑같이 학교에 간다는 의미로서 결과적으로 <strong className="text-slate-900 underline decoration-yellow-200 decoration-4 underline-offset-2">나는 학교에 다니는 학생입니다.</strong>를 나타냅니다.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-blue-50 p-6 rounded-3xl border border-blue-100">
                                    <h3 className="text-xl font-black text-blue-800 mb-3">2. 3인칭 단수 현재형이란?</h3><br />
                                    <p className="text-sm font-bold text-slate-700 leading-relaxed italic">
                                        주어가 3인칭 단수(he/she/it, 단수 명사)일 때 일반동사가 현재형을 나타낼 때는 반드시 일반동사 뒤에 -s/-es를 붙입니다.
                                    </p>
                                    <br />
                                    <ul className="mt-3 space-y-2 text-sm font-bold">
                                        <li className="bg-white p-2 rounded-lg border border-blue-100">come → comes, read → reads</li>
                                        <li className="bg-white p-2 rounded-lg border border-blue-100">watch → watches, fix → fixes</li>
                                        <li className="bg-white p-2 rounded-lg border border-blue-100">study → studies, try → tries</li>
                                        <li className="bg-white p-2 rounded-lg border border-blue-100">have → has (특수 변화)</li>
                                    </ul>
                                </div>
                            </div>
                        </section>

                        <section className="bg-white rounded-[3rem] p-8 md:p-10 shadow-xl border border-slate-100 text-left">
                            <h3 className="text-2xl font-black text-slate-800 italic mb-8">동작동사 vs 상태동사 (진행형 가능 여부)</h3>
                            <div className="grid md:grid-cols-2 gap-6">
                                <div className="bg-green-50 p-6 rounded-3xl border border-green-100">
                                    <h4 className="text-xl font-black text-green-700 mb-4">동작동사 (Action Verbs)</h4>
                                    <ul className="space-y-2 font-bold text-slate-700">
                                        <li className="bg-white p-2 rounded-lg border border-green-100">run (달리다)</li>
                                        <li className="bg-white p-2 rounded-lg border border-green-100">dance (춤추다)</li>
                                        <li className="bg-white p-2 rounded-lg border border-green-100">play (놀다/연주하다)</li>
                                        <li className="bg-white p-2 rounded-lg border border-green-100">wash (씻다)</li>
                                        <li className="bg-white p-2 rounded-lg border border-green-100">study (공부하다)</li>
                                    </ul>
                                    <div className="mt-4 bg-white p-4 rounded-2xl border-l-4 border-green-500 sentence-box cursor-pointer" onClick={() => speak("She is dancing now.")}>
                                        <p className="font-black text-green-800">She is dancing now. (지금 춤추는 중이다)</p>
                                        <p className="text-sm text-slate-600">동작이 실제로 진행 중이고 조만간 끝이 날 것을 암시하는 진행형이 자연스럽습니다.</p>
                                    </div>
                                </div>

                                <div className="bg-orange-50 p-6 rounded-3xl border border-orange-100">
                                    <h4 className="text-xl font-black text-orange-700 mb-4">상태동사 (Stative Verbs)</h4>
                                    <ul className="space-y-2 font-bold text-slate-700">
                                        <li className="bg-white p-2 rounded-lg border border-orange-100">know (알다)</li>
                                        <li className="bg-white p-2 rounded-lg border border-orange-100">love (사랑하다)</li>
                                        <li className="bg-white p-2 rounded-lg border border-orange-100">like (좋아하다)</li>
                                        <li className="bg-white p-2 rounded-lg border border-orange-100">have (가지다)</li>
                                        <li className="bg-white p-2 rounded-lg border border-orange-100">believe (믿다)</li>
                                    </ul>
                                    <div className="mt-4 bg-white p-4 rounded-2xl border-l-4 border-orange-500">
                                        <p className="font-black text-orange-800">I know her.(자연스러움) / I am knowing her.(어색함)</p>
                                        <p className="text-sm text-slate-600 mt-1">상태는 "진행되는 동작"이 아니라 마음/인식의 상태라 보통 진행형을 쓰지 않습니다.</p>
                                    </div>
                                </div>
                            </div>
                            <div className="mt-6 bg-slate-100 p-5 rounded-2xl border-l-4 border-slate-400">
                                <p className="font-bold text-slate-700">
                                    핵심: <span className="text-green-700">동작동사</span>는 움직임/행동이라 진행형이 가능하고,
                                    <span className="text-orange-700"> 상태동사</span>는 감정/소유/인식의 "상태"를 말하므로 진행형이 원칙적으로 어색합니다.
                                </p>
                            </div>
                        </section>

                        <section className="bg-white rounded-[3rem] p-8 md:p-10 shadow-xl border border-slate-100 text-left">
                            <h3 className="text-2xl font-black text-slate-800 italic mb-8">일반동사 현재형/부정문/의문문 규칙표</h3>
                            <div className="overflow-x-auto rounded-3xl border border-slate-200">
                                <table className="w-full text-sm text-center border-collapse">
                                    <thead className="bg-slate-50 font-sans text-sm tracking-normal text-slate-500 border-b">
                                        <tr>
                                            <th className="p-4 border-r">형태</th>
                                            <th className="p-4 border-r">1/2인칭 + 복수</th>
                                            <th className="p-4 border-r">3인칭 단수</th>
                                            <th className="p-4">예문</th>
                                        </tr>
                                    </thead>
                                    <tbody className="font-bold">
                                        <tr className="border-b">
                                            <td className="p-4 border-r bg-slate-50">현재형</td>
                                            <td className="p-4 border-r">동사원형</td>
                                            <td className="p-4 border-r text-blue-600">동사 + s/es</td>
                                            <td className="p-4 text-left">We play soccer. / She plays soccer.</td>
                                        </tr>
                                        <tr className="border-b">
                                            <td className="p-4 border-r bg-slate-50">부정문</td>
                                            <td className="p-4 border-r">do not + 동사원형</td>
                                            <td className="p-4 border-r text-red-600">does not + 동사원형</td>
                                            <td className="p-4 text-left">I do not like math. / He does not like math.</td>
                                        </tr>
                                        <tr>
                                            <td className="p-4 border-r bg-slate-50">의문문</td>
                                            <td className="p-4 border-r">Do + 주어 + 동사원형?</td>
                                            <td className="p-4 border-r text-blue-600">Does + 주어 + 동사원형?</td>
                                            <td className="p-4 text-left">Do you swim? / Does he swim?</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div className="grid md:grid-cols-3 gap-4 mt-6">
                                <div className="sentence-box p-4 rounded-2xl cursor-pointer" onClick={() => speak("Robin has an old camera.")}>
                                    <p className="font-black">Robin has an old camera.</p>
                                    <p className="text-xs text-slate-500">(로빈은 오래된 카메라를 가지고 있다.)</p>
                                </div>
                                <div className="sentence-box p-4 rounded-2xl cursor-pointer" onClick={() => speak("My cousin does not dance well.")}>
                                    <p className="font-black">My cousin does not dance well.</p>
                                    <p className="text-xs text-slate-500">(내 사촌은 춤을 잘 추지 못한다.)</p>
                                </div>
                                <div className="sentence-box p-4 rounded-2xl cursor-pointer" onClick={() => speak("Does your dad wear glasses?")}>
                                    <p className="font-black">Does your dad wear glasses?</p>
                                    <p className="text-xs text-slate-500">(너의 아빠는 안경을 쓰니?)</p>
                                </div>
                            </div>
                        </section>

                        <section className="bg-blue-600 rounded-[3rem] p-10 text-white shadow-2xl relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-12 opacity-10 rotate-12"><Icons.Microscope /></div>
                            <h3 className="text-2xl font-black mb-8 flex items-center gap-3 italic underline decoration-blue-400 underline-offset-8">
                                <Icons.Microscope /> 일반동사 검증 연구소 (30문항)
                            </h3>
                            {shuffledQuiz.length > 0 && currentQ && (
                                <div className="bg-white/10 backdrop-blur-xl p-8 rounded-[2.5rem] border border-white/20">
                                    <div className="mb-4 flex items-center justify-between gap-3">
                                        <div className="px-4 py-1 bg-white/20 rounded-full text-xs font-black uppercase tracking-widest text-blue-100 font-mono italic">
                                            Quest {quizIndex + 1} / {shuffledQuiz.length}
                                        </div>
                                        <div className="px-4 py-1 bg-yellow-300 text-slate-900 rounded-full text-xs font-black">{currentQ.category}</div>
                                    </div>
                                    <div className="mb-8 text-left">
                                        <p className="text-sm font-bold text-blue-200 mb-2 italic">교재 중등 2과 문장을 기반으로 알맞은 형태를 고르세요.</p>
                                        <p className="text-lg font-black bg-blue-900/50 p-5 rounded-xl border border-white/10 text-yellow-300">{currentQ.ko}</p>
                                    </div>
                                    <p className="text-xl font-black mb-8 tracking-tight text-left">Q. {currentQ.q}</p>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        {currentQ.options.map((opt, i) => (
                                            <button
                                                key={`${quizIndex}-${i}`}
                                                onClick={() => handleAnswer(i)}
                                                className={`quiz-btn py-4 rounded-2xl font-black shadow-lg text-base ${isCorrect && i === currentQ.ansIdx ? "bg-yellow-400 text-slate-900" : "bg-white text-blue-600 hover:bg-blue-50"}`}
                                                disabled={isCorrect && i !== currentQ.ansIdx}
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                    {quizFeedback && (
                                        <div className="mt-8 p-6 bg-white/20 rounded-2xl border border-white/30 text-left">
                                            <p className="text-sm font-bold flex items-center gap-2 leading-relaxed"><Icons.CheckCircle2 /> {quizFeedback}</p>
                                            <div className="flex gap-3 mt-6">
                                                <button onClick={() => speak(currentQ.answer)} className="flex-1 bg-white/20 text-white py-3 rounded-xl font-black shadow-md flex items-center justify-center gap-2 hover:bg-white/30">
                                                    <Icons.Volume2 size={16} /> <span className="listen-long">정답 문장 다시 듣기</span><span className="listen-short">다시 듣기</span>
                                                </button>
                                                {isCorrect && (
                                                    <button
                                                        onClick={() => {
                                                            if (quizIndex < shuffledQuiz.length - 1) {
                                                                nextQuestion();
                                                            } else {
                                                                restartQuiz();
                                                            }
                                                        }}
                                                        className="flex-1 bg-yellow-400 text-slate-900 py-3 rounded-xl font-black shadow-md hover:bg-yellow-300 transition-colors"
                                                    >
                                                        {quizIndex < shuffledQuiz.length - 1 ? "다음 문항" : "다시 도전"}
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </section>

                        <section className="bg-slate-100 rounded-[3rem] p-10 shadow-inner">
                            <div className="flex items-center justify-between mb-8">
                                <h3 className="text-2xl font-black text-slate-800 flex items-center gap-2 italic">
                                    <Icons.Volume2 className="text-blue-600" /> 문장 낭독 훈련 (30문장)
                                </h3>
                            </div>
                            <div className="grid md:grid-cols-2 gap-4">
                                {speakingSentences.map((item, idx) => (
                                    <div
                                        key={idx}
                                        className="bg-white p-5 rounded-2xl flex justify-between items-center border border-slate-200 hover:border-blue-400 transition-all hover:shadow-lg group cursor-pointer text-left"
                                        onClick={() => speak(item.en)}
                                    >
                                        <div className="flex-1 pr-4">
                                            <p className="text-sm font-black text-slate-800 leading-tight group-hover:text-blue-600">{item.en}</p>
                                            <p className="text-xs text-slate-400 mt-2 font-medium">{item.ko}</p>
                                        </div>
                                        <div className="text-slate-300 group-hover:text-blue-500">
                                            <Icons.PlayCircle size={24} />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </main>

                    <footer className="content-shell px-4 mt-20 text-center border-t-2 border-slate-100 pt-10 pb-20">
                        <div className="max-w-4xl mx-auto">
                            <h3 className="text-2xl font-black text-gray-800 mb-2 italic">Tony's Speaking English Grammar</h3>
                            <p className="text-lg text-orange-600 font-bold mb-4">영어가 터지는 비결은 바로 <span className="underline">어순 감각</span>에 있습니다.</p>
                            <div className="h-1.5 w-16 bg-orange-400 mx-auto mb-8 rounded-full"></div>
                            <div className="text-gray-500 text-sm leading-relaxed italic font-bold">
                                <span>Tony's Speaking English Grammar helps you master the natural sense of English word order.</span>
                                <span className="not-italic font-bold text-xs mt-4 block opacity-40">© 2026 Tony's English. All rights reserved.</span>
                            </div>
                        </div>
                    </footer>
               </div>
            );
        };

        const container = document.getElementById("root");
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
