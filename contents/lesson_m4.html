        .lesson-root [class*="text-[11px]"],

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const Icons = {

const coreQuiz = [

    { category: "when/where/why/how", q: "A: (   ) time does the shop open?", ko: "가게는 몇 시에 문을 여니?", options: ["When", "Where", "What", "How"], ansIdx: 2, answer: "What time does the shop open?", reason: "시각은 What time으로 묻습니다." },
    { category: "when/where/why/how", q: "(   ) do you spend your day?", ko: "너는 하루를 어떻게 보내니?", options: ["How", "Why", "When", "Where"], ansIdx: 0, answer: "How do you spend your day?", reason: "행동 방식은 How를 사용합니다." },

    { category: "when/where/why/how", q: "(   ) does the class start?", ko: "언제 수업이 시작하니?", options: ["When", "Where", "Why", "How"], ansIdx: 0, answer: "When does the class start?", reason: "시간 질문은 When + does + 주어 + 동사원형입니다." },
    { category: "when/where/why/how", q: "(   ) are my glasses?", ko: "내 안경은 어디에 있니?", options: ["When", "Where", "Why", "How"], ansIdx: 1, answer: "Where are my glasses?", reason: "장소를 묻는 의문사는 Where입니다." },
    { category: "when/where/why/how", q: "(   ) time do you get up?", ko: "너는 몇 시에 일어나니?", options: ["Who", "What", "Which", "How"], ansIdx: 1, answer: "What time do you get up?", reason: "시간 표현은 What time을 사용합니다." }

const howQuiz = [
    { category: "how 확장", q: "How (   ) do you exercise?", ko: "너는 얼마나 자주 운동하니?", options: ["old", "often", "many", "long"], ansIdx: 1, answer: "How often do you exercise?", reason: "빈도는 How often으로 묻습니다." },
    { category: "how 확장", q: "How (   ) is your daughter?", ko: "너의 딸은 몇 살이니?", options: ["old", "much", "tall", "far"], ansIdx: 0, answer: "How old is your daughter?", reason: "나이는 How old를 씁니다." },
    { category: "how 확장", q: "How (   ) is this computer?", ko: "이 컴퓨터는 얼마니?", options: ["long", "many", "much", "often"], ansIdx: 2, answer: "How much is this computer?", reason: "가격은 How much로 묻습니다." },

    { category: "how 확장", q: "How (   ) is it to the post office?", ko: "우체국까지 얼마나 머니?", options: ["many", "far", "old", "much"], ansIdx: 1, answer: "How far is it to the post office?", reason: "거리는 How far로 묻습니다." },
    { category: "how 확장", q: "How (   ) subjects do you study?", ko: "너는 과목을 몇 개 공부하니?", options: ["much", "many", "long", "often"], ansIdx: 1, answer: "How many subjects do you study?", reason: "subjects는 셀 수 있는 복수 명사입니다." },
    { category: "how 확장", q: "How (   ) homework do you have today?", ko: "오늘 숙제가 얼마나 많니?", options: ["much", "many", "old", "far"], ansIdx: 0, answer: "How much homework do you have today?", reason: "homework는 불가산 명사라 How much를 씁니다." },
    { category: "how 확장", q: "How (   ) does it take to the hotel?", ko: "호텔까지 얼마나 걸리니?", options: ["long", "often", "many", "tall"], ansIdx: 0, answer: "How long does it take to the hotel?", reason: "시간/길이는 How long을 씁니다." }

const allQuizMaster = [...coreQuiz, ...adverbQuiz, ...howQuiz];

const shuffleArray = (arr) => [...arr].sort(() => Math.random() - 0.5);
const buildQuizSequence = () => {
    const a = shuffleArray(allQuizMaster.filter((q) => q.category === "who/what/which"));
    const b = shuffleArray(allQuizMaster.filter((q) => q.category === "when/where/why/how"));
    const c = shuffleArray(allQuizMaster.filter((q) => q.category === "how 확장"));
    return [...a, ...b, ...c];
};

const logicTemplates = {
    "Who is the woman over there?": ["The woman over there is my English teacher.", "Is the woman over there your English teacher?", "Is the woman over there [your English teacher]?", "Replace [your English teacher] with who.", "Who is the woman over there?"],
    "What is your name?": ["My name is Charlie.", "Is your name Charlie?", "Is your name [Charlie]?", "Replace [Charlie] with what.", "What is your name?"],
    "What time is it now?": ["It is ten o'clock now.", "Is it ten o'clock now?", "Is it [ten o'clock] now?", "Replace [ten o'clock] with what time.", "What time is it now?"],
    "Who takes care of the babies?": ["Their grandmother takes care of the babies.", "Does their grandmother take care of the babies?", "Does [their grandmother] take care of the babies?", "Replace [their grandmother] with who.", "Who takes care of the babies? (does take care -> takes care)"],
    "Which do you like, summer or winter?": ["I like winter.", "Do you like winter?", "Do you like [winter]?", "Replace [winter] with which (summer or winter).", "Which do you like, summer or winter?"],
    "What season do you like the most?": ["I like spring the most.", "Do you like spring the most?", "Do you like [spring] the most?", "Replace [spring] with what season.", "What season do you like the most?"],
    "What does he do after school?": ["He plays soccer after school.", "Does he play soccer after school?", "Does he do [something] after school?", "Replace [something] with what.", "What does he do after school?"],
    "Which do you prefer, fish or meat?": ["I prefer fish.", "Do you prefer fish?", "Do you prefer [fish]?", "Replace [fish] with which (fish or meat).", "Which do you prefer, fish or meat?"],
    "Who sings well in your class?": ["Mina sings well in my class.", "Does Mina sing well in your class?", "Does [Mina] sing well in your class?", "Replace [Mina] with who.", "Who sings well in your class? (does sing -> sings)"],
    "What kind of pet do you want?": ["I want a cat.", "Do you want a cat?", "Do you want [a cat]?", "Replace [a cat] with what kind of pet.", "What kind of pet do you want?"],
    "When do you do your homework?": ["I do my homework after dinner.", "Do you do your homework after dinner?", "Do you do your homework [after dinner]?", "Replace [after dinner] with when.", "When do you do your homework?"],
    "Why do you study French?": ["I study French because I want to travel to France.", "Do you study French because you want to travel to France?", "Do you study French [because I want to travel to France]?", "Replace [because ...] with why.", "Why do you study French?"],
    "How do I get to the police station?": ["You go straight two blocks.", "Do I go straight two blocks?", "Do I get there [by going straight two blocks]?", "Replace [by going straight two blocks] with how.", "How do I get to the police station?"],
    "How do you feel today?": ["I feel really tired today.", "Do you feel really tired today?", "Do you feel [really tired] today?", "Replace [really tired] with how.", "How do you feel today?"],
    "What time does the shop open?": ["The shop opens at 7:00 a.m.", "Does the shop open at 7:00 a.m.?", "Does the shop open [at 7:00 a.m.]?", "Replace [at 7:00 a.m.] with what time.", "What time does the shop open?"],
    "How do you spend your day?": ["I spend my day reading books.", "Do you spend your day reading books?", "Do you spend your day [reading books]?", "Replace [reading books] with how.", "How do you spend your day?"],
    "Why is she always busy?": ["She is always busy because she works two jobs.", "Is she always busy because she works two jobs?", "Is she always busy [because she works two jobs]?", "Replace [because ...] with why.", "Why is she always busy?"],
    "When does the class start?": ["The class starts at nine.", "Does the class start at nine?", "Does the class start [at nine]?", "Replace [at nine] with when.", "When does the class start?"],
    "Where are my glasses?": ["Your glasses are on the desk.", "Are your glasses on the desk?", "Are your glasses [on the desk]?", "Replace [on the desk] with where.", "Where are my glasses?"],
    "What time do you get up?": ["I get up at six.", "Do you get up at six?", "Do you get up [at six]?", "Replace [at six] with what time.", "What time do you get up?"],
    "How often do you exercise?": ["I exercise twice a week.", "Do you exercise twice a week?", "Do you exercise [twice a week]?", "Replace [twice a week] with how often.", "How often do you exercise?"],
    "How old is your daughter?": ["My daughter is thirteen years old.", "Is your daughter thirteen years old?", "Is your daughter [thirteen years old]?", "Replace [thirteen years old] with how old.", "How old is your daughter?"],
    "How much is this computer?": ["This computer is 1,200 dollars.", "Is this computer 1,200 dollars?", "Is this computer [1,200 dollars]?", "Replace [1,200 dollars] with how much.", "How much is this computer?"],
    "How long does it take from Seoul to Busan by KTX?": ["It takes about two and a half hours from Seoul to Busan by KTX.", "Does it take about two and a half hours from Seoul to Busan by KTX?", "Does it take [about two and a half hours] from Seoul to Busan by KTX?", "Replace [about two and a half hours] with how long.", "How long does it take from Seoul to Busan by KTX?"],
    "How many people are there in your family?": ["There are four people in my family.", "Are there four people in your family?", "Are there [four] people in your family?", "Replace [four] with how many.", "How many people are there in your family?"],
    "How tall is he?": ["He is 170 centimeters tall.", "Is he 170 centimeters tall?", "Is he [170 centimeters tall]?", "Replace [170 centimeters tall] with how tall.", "How tall is he?"],
    "How far is it to the post office?": ["It is about 100 meters to the post office.", "Is it about 100 meters to the post office?", "Is it [about 100 meters] to the post office?", "Replace [about 100 meters] with how far.", "How far is it to the post office?"],
    "How many subjects do you study?": ["I study ten subjects.", "Do you study ten subjects?", "Do you study [ten] subjects?", "Replace [ten] with how many.", "How many subjects do you study?"],
    "How much homework do you have today?": ["I have a lot of homework today.", "Do you have a lot of homework today?", "Do you have [a lot of] homework today?", "Replace [a lot of] with how much.", "How much homework do you have today?"],
    "How long does it take to the hotel?": ["It takes an hour to the hotel.", "Does it take an hour to the hotel?", "Does it take [an hour] to the hotel?", "Replace [an hour] with how long.", "How long does it take to the hotel?"]
};

const buildLogicSteps = (q) => {
    const steps = logicTemplates[q.answer];
    if (steps) {
        return steps.map((line, idx) => {
            if (idx === 3) {
                const m = line.match(/^Replace \[(.+)\] with (.+)\.$/i);
                if (m) {
                    return `Step 4. [${m[1]}]를 ${m[2]} 의문사(구)로 대체한 후, 문장 맨 앞으로 이동시킵니다.`;
                }
                return "Step 4. 의문사가 주어 역할이면 do/does 없이 동사를 바로 두고, 의문사를 문장 맨 앞으로 이동시킵니다.";
            }
            if (idx === 4 && line.includes("(does")) {
                return `Step 5. ${line} 즉, 조동사 does + 동사원형 형태가 3인칭 단수 동사 한 단어 형태로 바뀝니다.`;
            }
            return `Step ${idx + 1}. ${line}`;
        });
    }
    const keyWord = q.options[q.ansIdx];
    return [
        "Step 1. Start with a declarative sentence.",
        "Step 2. Make a Yes/No question.",
        "Step 3. Hide the target information in brackets.",
        `Step 4. Replace the bracket with ${keyWord}.`,
        `Step 5. Move the wh-word to the front: ${q.answer}`
    ];
};

const App = () => {
    const [quizIndex, setQuizIndex] = useState(0);
    const [quizFeedback, setQuizFeedback] = useState("");
    const [shuffledQuiz, setShuffledQuiz] = useState([]);
    const [isCorrect, setIsCorrect] = useState(false);

    const speak = (text) => {
        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = "en-US";
            uttr.rate = 0.88;
            window.speechSynthesis.speak(uttr);
        }
    };

    useEffect(() => {
        setShuffledQuiz(buildQuizSequence());
    }, []);

    const handleAnswer = (clickedIdx) => {
        if (isCorrect) return;
        const current = shuffledQuiz[quizIndex];
        if (clickedIdx === current.ansIdx) {
            setIsCorrect(true);
            setQuizFeedback(`정답입니다! ${current.reason}`);
            speak(current.answer);
            return;
        }
        setIsCorrect(false);
        setQuizFeedback("다시 생각해보세요. 의문사 의미(사람/사물/선택/시간/이유/방법)와 어순을 함께 확인하세요.");
    };

    const nextQuestion = () => {
        if (quizIndex < shuffledQuiz.length - 1) {
            setQuizIndex(quizIndex + 1);
            setQuizFeedback("");
            setIsCorrect(false);
            return;
        }
        setQuizFeedback("30문제를 모두 완료했습니다. 다시 도전해보세요.");
    };

    const restartQuiz = () => {
        setShuffledQuiz(buildQuizSequence());
        setQuizIndex(0);
        setQuizFeedback("");
        setIsCorrect(false);
    };

    const currentQ = shuffledQuiz[quizIndex];
    const speakingSentences = useMemo(() => allQuizMaster.map((item) => ({ en: item.answer, ko: item.ko })), []);
    const progressPercent = shuffledQuiz.length ? Math.round((quizIndex / shuffledQuiz.length) * 100) : 0;

    return (
        <div className="lesson-root min-h-screen bg-slate-50 text-slate-900 pb-12 overflow-x-hidden antialiased">
            <header className="bg-white border-b sticky top-0 z-50 shadow-sm px-4 py-4">
                <div className="content-shell flex justify-between items-center">
                    <div className="flex items-center gap-2">
                        <div className="bg-blue-600 text-white p-2 rounded-xl shadow-lg shadow-blue-100"><Icons.Zap /></div>
                        <div className="text-left">
                            <h1 className="text-2xl font-black tracking-tighter italic leading-none">Grammar CHECK CHECK</h1>
                            <span className="text-blue-600 font-black text-xs mt-1 block tracking-tight italic">중학영어 1-A / Lesson 4. What Is Your Hobby?</span>
                        </div>
                    </div>
                </div>
            </header>

            <main className="content-shell p-4 md:p-6 space-y-8">
                <section className="bg-white rounded-[3rem] p-8 md:p-10 shadow-2xl border border-slate-100 text-left">
                    <h2 className="text-3xl font-black text-slate-800 italic mb-8 underline decoration-blue-100 underline-offset-8">복습: 의문문의 탄생 원리</h2>
                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                            <h3 className="text-xl font-black text-slate-800 mb-3">1. 육하원칙 의문사 6형제</h3>
                            <ul className="space-y-2 font-bold text-slate-700 text-sm">
                                <li className="bg-white p-2 rounded-lg border border-slate-200">Who(누가), When(언제), Where(어디서)</li>
                                <li className="bg-white p-2 rounded-lg border border-slate-200">What(무엇), Why(왜), How(어떻게)</li>
                            </ul>
                            <div className="mt-4 bg-white p-4 rounded-2xl border-l-4 border-blue-500">
                                <p className="font-black text-blue-700">5단계 생성 공식</p>
                                <p className="text-sm mt-2 font-bold text-slate-700">1) 평서문 → 2) Yes/No 의문문 → 3) 궁금한 정보 가리기 → 4) 의문사 교체 → 5) 의문사 맨 앞으로</p>
                            </div>
                        </div>
                        <div className="bg-blue-50 p-6 rounded-3xl border border-blue-100">
                            <h3 className="text-xl font-black text-blue-800 mb-3">2. be동사 vs 일반동사</h3>
                            <div className="space-y-3 text-sm font-bold">
                                <div className="bg-white p-3 rounded-xl border border-blue-100">
                                    <p className="text-blue-700">be동사</p>
                                    <p>Who is the woman over there? (저기 있는 저 여자는 누구니?)</p>
                                    <p className="text-xs text-slate-500">be동사를 주어 앞으로 보냅니다.</p>
                                </div>
                                <div className="bg-white p-3 rounded-xl border border-blue-100">
                                    <p className="text-blue-700">일반동사</p>
                                    <p>Why do you study French? (너는 왜 프랑스어를 공부하니?)</p>
                                    <p className="text-xs text-slate-500">do/does를 앞에 두고 본동사는 원형을 씁니다.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section className="bg-white rounded-[3rem] p-8 md:p-10 shadow-xl border border-slate-100 text-left">
                    <h3 className="text-2xl font-black text-slate-800 italic mb-8">심화 1: who / what / which</h3>
                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="bg-green-50 p-6 rounded-3xl border border-green-100">
                            <h4 className="text-xl font-black text-green-700 mb-4">What vs Which</h4>
                            <ul className="space-y-2 font-bold text-slate-700 text-sm">
                                <li className="bg-white p-2 rounded-lg border border-green-100">What: 범위가 열려 있을 때 (무엇/무슨)</li>
                                <li className="bg-white p-2 rounded-lg border border-green-100">Which: 정해진 선택지에서 고를 때 (어느/어느 것)</li>
                            </ul>
                            <div className="mt-4 bg-white p-4 rounded-2xl border-l-4 border-green-500 sentence-box cursor-pointer" onClick={() => speak("Which do you prefer, fish or meat?") }>
                                <p className="font-black text-green-800">Which do you prefer, fish or meat? (생선과 고기 중 어느 것을 더 선호하니?)</p>
                            </div>
                        </div>
                        <div className="bg-orange-50 p-6 rounded-3xl border border-orange-100">
                            <h4 className="text-xl font-black text-orange-700 mb-4">의문형용사 + 주어 의문사</h4>
                            <ul className="space-y-2 font-bold text-slate-700 text-sm">
                                <li className="bg-white p-2 rounded-lg border border-orange-100">What/Which + 명사: What season, Which bus</li>
                                <li className="bg-white p-2 rounded-lg border border-orange-100">Who가 주어인 문장도 5단계를 동일 적용: does 의문문 생성 → [주어]를 who로 대체 → 맨 앞으로 이동 → 최종형에서 does+동사원형이 3인칭 단수 동사로 정리</li>
                            </ul>
                            <div className="mt-4 bg-white p-4 rounded-2xl border-l-4 border-orange-500 sentence-box cursor-pointer" onClick={() => speak("Who takes care of the babies?") }>
                                <p className="font-black text-orange-800">Who takes care of the babies? (아기들을 누가 돌보니?)</p>
                            </div>
                        </div>
                    </div>
                    <div className="mt-6 bg-amber-50 p-5 rounded-2xl border-l-4 border-amber-500">
                        <p className="font-bold text-amber-800">Tony's Strategy - 중등 내신 포인트: 의문사가 주어일 때도 공식은 동일합니다. does 의문문을 만든 뒤 [주어]를 who로 바꾸어 앞으로 보내면, 최종 문장에서 3인칭 단수 동사형으로 정리됩니다. (예: does take care → takes care)</p>
                    </div>
                </section>

                <section className="bg-white rounded-[3rem] p-8 md:p-10 shadow-xl border border-slate-100 text-left">
                    <h3 className="text-2xl font-black text-slate-800 italic mb-8">심화 2: when / where / why / how + 확장 표현</h3>
                    <div className="overflow-x-auto rounded-3xl border border-slate-200">
                        <table className="w-full text-sm text-center border-collapse">
                            <thead className="bg-slate-50 font-sans text-sm tracking-normal text-slate-500 border-b">
                                <tr>
                                    <th className="p-4 border-r">표현</th>
                                    <th className="p-4 border-r">의미</th>
                                    <th className="p-4">교재 예문</th>
                                </tr>
                            </thead>
                            <tbody className="font-bold">
                                <tr className="border-b"><td className="p-4 border-r bg-slate-50">How many</td><td className="p-4 border-r">개수</td><td className="p-4 text-left">How many people are there in your family? (너희 가족은 몇 명이니?)</td></tr>
                                <tr className="border-b"><td className="p-4 border-r bg-slate-50">How much</td><td className="p-4 border-r">양/가격</td><td className="p-4 text-left">How much is this computer? (이 컴퓨터는 얼마니?)</td></tr>
                                <tr className="border-b"><td className="p-4 border-r bg-slate-50">How old</td><td className="p-4 border-r">나이</td><td className="p-4 text-left">How old is your daughter? (너의 딸은 몇 살이니?)</td></tr>
                                <tr className="border-b"><td className="p-4 border-r bg-slate-50">How long</td><td className="p-4 border-r">시간/길이</td><td className="p-4 text-left">How long does it take from Seoul to Busan by KTX? (KTX로 서울에서 부산까지 얼마나 걸리니?)</td></tr>
                                <tr><td className="p-4 border-r bg-slate-50">How often</td><td className="p-4 border-r">빈도</td><td className="p-4 text-left">How often do you exercise? (너는 얼마나 자주 운동하니?)</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div className="grid md:grid-cols-3 gap-4 mt-6">
                        <div className="sentence-box p-4 rounded-2xl cursor-pointer" onClick={() => speak("Why do you study French?") }>
                            <p className="font-black">Why do you study French? (너는 왜 프랑스어를 공부하니?)</p>
                        </div>
                        <div className="sentence-box p-4 rounded-2xl cursor-pointer" onClick={() => speak("How long does it take from Seoul to Busan by KTX?") }>
                            <p className="font-black">How long does it take from Seoul to Busan by KTX? (KTX로 서울에서 부산까지 얼마나 걸리니?)</p>
                        </div>
                        <div className="sentence-box p-4 rounded-2xl cursor-pointer" onClick={() => speak("How often do you exercise?") }>
                            <p className="font-black">How often do you exercise? (너는 얼마나 자주 운동하니?)</p>
                        </div>
                    </div>
                </section>

                <section className="bg-blue-600 rounded-[3rem] p-10 text-white shadow-2xl relative overflow-hidden">
                    <div className="absolute top-0 right-0 p-12 opacity-10 rotate-12"><Icons.Microscope /></div>
                    <h3 className="text-2xl font-black mb-4 flex items-center gap-3 italic underline decoration-blue-400 underline-offset-8">
                        <Icons.Microscope /> 의문사 검증 연구소 (30문항)
                    </h3>
                    {shuffledQuiz.length > 0 && currentQ && (
                        <div className="bg-white/10 backdrop-blur-xl p-8 rounded-[2.5rem] border border-white/20">
                            <div className="mb-5">
                                <div className="h-3 bg-white/20 rounded-full overflow-hidden">
                                    <div className="h-full bg-yellow-300 transition-all duration-300" style={{ width: `${progressPercent}%` }}></div>
                                </div>
                                <p className="text-xs text-blue-100 mt-2 font-bold">진행도 {progressPercent}%</p>
                            </div>
                            <div className="mb-4 flex items-center justify-between gap-3">
                                <div className="px-4 py-1 bg-white/20 rounded-full text-xs font-black uppercase tracking-widest text-blue-100 font-mono italic">Quest {quizIndex + 1} / {shuffledQuiz.length}</div>
                                <div className="px-4 py-1 bg-yellow-300 text-slate-900 rounded-full text-xs font-black">{currentQ.category}</div>
                            </div>
                            <div className="mb-8 text-left">
                                <p className="text-sm font-bold text-blue-200 mb-2 italic">교재 중등 4과 A/B/C 문장을 기반으로 알맞은 의문사를 고르세요.</p>
                                <p className="text-lg font-black bg-blue-900/50 p-5 rounded-xl border border-white/10 text-yellow-300">Q. {currentQ.q} ({currentQ.ko})</p>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {currentQ.options.map((opt, i) => (
                                    <button
                                        key={`${quizIndex}-${i}`}
                                        onClick={() => handleAnswer(i)}
                                        className={`quiz-btn py-4 rounded-2xl font-black shadow-lg text-base ${isCorrect && i === currentQ.ansIdx ? "bg-yellow-400 text-slate-900" : "bg-white text-blue-600 hover:bg-blue-50"}`}
                                        disabled={isCorrect && i !== currentQ.ansIdx}
                                    >{opt}</button>
                                ))}
                            </div>
                            {quizFeedback && (
                                <div className="mt-8 p-6 bg-white/20 rounded-2xl border border-white/30 text-left">
                                    <p className="text-sm font-bold flex items-center gap-2 leading-relaxed"><Icons.CheckCircle2 /> {quizFeedback}</p>
                                    <div className="mt-3 p-4 rounded-xl bg-blue-950/30 border border-white/20">
                                        <p className="font-black">{currentQ.answer} ({currentQ.ko})</p>
                                    </div>
                                    {isCorrect && (
                                        <div className="mt-4 p-4 rounded-xl bg-white/10 border border-white/20">
                                            <p className="font-black text-yellow-300 mb-2">생성 논리 Step 1~5</p>
                                            {buildLogicSteps(currentQ).map((line, idx) => <p key={idx} className="text-xs font-bold leading-relaxed">{line}</p>)}
                                        </div>
                                    )}
                                    <div className="flex gap-3 mt-6">
                                        <button onClick={() => speak(currentQ.answer)} className="flex-1 bg-white/20 text-white py-3 rounded-xl font-black shadow-md flex items-center justify-center gap-2 hover:bg-white/30">
                                            <Icons.Volume2 size={16} /> 정답 문장 다시 듣기
                                        </button>
                                        {isCorrect && (
                                            <button
                                                onClick={() => {
                                                    if (quizIndex < shuffledQuiz.length - 1) {
                                                        nextQuestion();
                                                    } else {
                                                        restartQuiz();
                                                    }
                                                }}
                                                className="flex-1 bg-yellow-400 text-slate-900 py-3 rounded-xl font-black shadow-md hover:bg-yellow-300 transition-colors"
                                            >{quizIndex < shuffledQuiz.length - 1 ? "다음 문항" : "다시 도전"}</button>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </section>

                <section className="bg-slate-100 rounded-[3rem] p-10 shadow-inner">
                    <div className="flex items-center justify-between mb-8">
                        <h3 className="text-2xl font-black text-slate-800 flex items-center gap-2 italic"><Icons.Volume2 className="text-blue-600" /> 문장 낭독 훈련 (30문장)</h3>
                    </div>
                    <div className="grid md:grid-cols-2 gap-4">
                        {speakingSentences.map((item, idx) => (
                            <div
                                key={idx}
                                className="bg-white p-5 rounded-2xl flex justify-between items-center border border-slate-200 hover:border-blue-400 transition-all hover:shadow-lg group cursor-pointer text-left"
                                onClick={() => speak(item.en)}
                            >
                                <div className="flex-1 pr-4">
                                    <p className="text-sm font-black text-slate-800 leading-tight group-hover:text-blue-600">{item.en}</p>
                                    <p className="text-xs text-slate-400 mt-2 font-medium">({item.ko})</p>
                                </div>
                                <div className="text-slate-300 group-hover:text-blue-500"><Icons.PlayCircle size={24} /></div>
                            </div>
                        ))}
                    </div>
                </section>
            </main>

            <footer className="content-shell px-4 mt-20 text-center border-t-2 border-slate-100 pt-10 pb-20">
                <div className="max-w-4xl mx-auto">
                    <h3 className="text-2xl font-black text-gray-800 mb-2 italic">Tony's Speaking English Grammar</h3>
                    <p className="text-lg text-orange-600 font-bold mb-4">영어가 터지는 비결은 바로 <span className="underline">어순 감각</span>에 있습니다.</p>
                    <div className="h-1.5 w-16 bg-orange-400 mx-auto mb-8 rounded-full"></div>
                    <div className="text-gray-500 text-sm leading-relaxed italic font-bold">
                        <span>Tony's Speaking English Grammar helps you master the natural sense of English word order.</span>
                        <span className="not-italic font-bold text-xs mt-4 block opacity-40">© 2026 Tony's English. All rights reserved.</span>
                    </div>
                </div>
            </footer>
        </div>
    );
};

const container = document.getElementById("root");
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>
</body>
</html>
