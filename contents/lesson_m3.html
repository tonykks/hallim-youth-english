<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grammar CHECK CHECK - 명사와 관사</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        :root {
            --fs-lg: clamp(1.06rem, 0.98rem + 0.35vw, 1.2rem);
            --fs-md: clamp(0.96rem, 0.9rem + 0.2vw, 1.05rem);
            --fs-sm: clamp(0.86rem, 0.82rem + 0.18vw, 0.94rem);
        }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .content-shell { width: min(100% - 1rem, 1180px); margin-inline: auto; }
        .lesson-root { font-size: var(--fs-md); line-height: 1.6; }
        .lesson-root .font-serif,
        .lesson-root .font-mono { font-family: 'Noto Sans KR', sans-serif !important; }
        .lesson-root [class*="text-[9px]"],
        .lesson-root [class*="text-[10px]"],
        .lesson-root [class*="text-[11px]"],
        .lesson-root .text-xs { font-size: var(--fs-sm) !important; line-height: 1.45 !important; }
        .lesson-root .text-sm { font-size: var(--fs-md) !important; line-height: 1.55 !important; }
        .lesson-root .text-lg { font-size: var(--fs-lg) !important; line-height: 1.45 !important; }
        .quiz-btn { transition: all 0.2s; }
        .quiz-btn:active { transform: scale(0.95); }
        .sentence-box { transition: all 0.2s; border: 1px solid #e2e8f0; }
        .sentence-box:hover { background-color: #ffffff; transform: translateX(3px); border-color: #93c5fd; box-shadow: 0 4px 8px -2px rgb(0 0 0 / 0.12); }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const Icons = {
    Zap: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.71 14.71 4H20v5.29L9.29 20H4z"/><path d="m15.5 6.5 2 2"/></svg>,
    Microscope: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></svg>,
    Volume2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
    PlayCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>,
    CheckCircle2: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10Z"/><path d="m9 12 2 2 4-4"/></svg>
};

const nounQuiz = [
    { category: "명사", q: "There are three (   ) on the table.", ko: "식탁 위에 감자 세 개가 있다.", options: ["potatos", "potatoes", "potato", "potato's"], ansIdx: 1, answer: "There are three potatoes on the table.", reason: "-o 끝 명사 potato의 복수형은 potatoes입니다." },
    { category: "명사", q: "The (   ) are sleeping in the room.", ko: "그 아기들이 방에서 자고 있다.", options: ["babys", "babies", "babyes", "baby"], ansIdx: 1, answer: "The babies are sleeping in the room.", reason: "baby는 자음+y로 끝나 복수형이 babies가 됩니다." },
    { category: "명사", q: "We need two (   ) in the kitchen.", ko: "우리는 부엌에 칼 두 자루가 필요하다.", options: ["knifes", "knivies", "knives", "knifees"], ansIdx: 2, answer: "We need two knives in the kitchen.", reason: "knife는 -fe가 -ves로 바뀌어 knives가 됩니다." },
    { category: "명사", q: "Two (   ) live in the hole.", ko: "생쥐 두 마리가 구멍 안에 살고 있다.", options: ["mouses", "mice", "mouse", "mices"], ansIdx: 1, answer: "Two mice live in the hole.", reason: "mouse의 복수형은 불규칙하게 mice입니다." },
    { category: "명사", q: "Their (   ) are very tall.", ko: "그들의 아이들은 매우 키가 크다.", options: ["childs", "childes", "children", "child"], ansIdx: 2, answer: "Their children are very tall.", reason: "child의 복수형은 children입니다." },
    { category: "명사", q: "These (   ) are delicious.", ko: "이 토마토들은 맛있다.", options: ["tomatos", "tomatoes", "tomato", "tomato's"], ansIdx: 1, answer: "These tomatoes are delicious.", reason: "tomato는 복수형으로 tomatoes를 씁니다." },
    { category: "명사", q: "Emma always takes many (   ).", ko: "엠마는 항상 사진을 많이 찍는다.", options: ["photo", "photoes", "photos", "photoss"], ansIdx: 2, answer: "Emma always takes many photos.", reason: "photo의 복수형은 photos입니다." },
    { category: "명사", q: "There are 48 (   ) in Asia.", ko: "아시아에는 48개의 나라가 있다.", options: ["country", "countrys", "countries", "countres"], ansIdx: 2, answer: "There are 48 countries in Asia.", reason: "country는 복수형으로 countries를 씁니다." },
    { category: "명사", q: "Two (   ) are waiting outside.", ko: "남자 두 명이 밖에서 기다리고 있다.", options: ["mans", "men", "manes", "mens"], ansIdx: 1, answer: "Two men are waiting outside.", reason: "man의 복수형은 불규칙하게 men입니다." },
    { category: "명사", q: "The child has two loose (   ).", ko: "그 아이는 흔들리는 이가 두 개 있다.", options: ["tooths", "toothes", "teeth", "teeths"], ansIdx: 2, answer: "The child has two loose teeth.", reason: "tooth의 복수형은 불규칙하게 teeth입니다." }
];

const quantifierQuiz = [
    { category: "수량", q: "He gives me (   ) every day.", ko: "그는 매일 나에게 꽃 한 송이를 준다.", options: ["a flower", "flower", "flowers", "some flower"], ansIdx: 0, answer: "He gives me a flower every day.", reason: "셀 수 있는 단수 명사 앞에는 a/an을 씁니다." },
    { category: "수량", q: "I put some (   ) in a bowl.", ko: "나는 그릇에 밀가루를 좀 넣는다.", options: ["flours", "flour", "a flour", "many flour"], ansIdx: 1, answer: "I put some flour in a bowl.", reason: "flour는 셀 수 없는 명사입니다." },
    { category: "수량", q: "Her favorite (   ) is pizza.", ko: "그녀가 가장 좋아하는 음식은 피자다.", options: ["foods", "food", "a food", "many food"], ansIdx: 1, answer: "Her favorite food is pizza.", reason: "여기서는 food를 불가산 개념으로 사용합니다." },
    { category: "수량", q: "She doesn't have (   ) questions.", ko: "그녀는 질문이 하나도 없다.", options: ["some", "many", "any", "a little"], ansIdx: 2, answer: "She doesn't have any questions.", reason: "부정문에서는 any를 씁니다." },
    { category: "수량", q: "My brother has (   ) toys.", ko: "내 남동생은 장난감을 많이 가지고 있다.", options: ["much", "many", "a little", "little"], ansIdx: 1, answer: "My brother has many toys.", reason: "toys는 셀 수 있는 복수 명사입니다." },
    { category: "수량", q: "I need (   ).", ko: "나는 조언 한 마디가 필요하다.", options: ["an advice", "a advice", "a piece of advice", "many advices"], ansIdx: 2, answer: "I need a piece of advice.", reason: "advice는 불가산 명사라 단위 표현이 필요합니다." },
    { category: "수량", q: "Would you like (   )?", ko: "차 한 잔 드시겠어요?", options: ["a tea", "a cup of tea", "two teas", "many tea"], ansIdx: 1, answer: "Would you like a cup of tea?", reason: "tea는 보통 불가산이라 cup 단위를 씁니다." },
    { category: "수량", q: "She drinks (   ) every day.", ko: "그녀는 매일 물 여덟 잔을 마신다.", options: ["eight waters", "eight glasses of water", "many water", "a water"], ansIdx: 1, answer: "She drinks eight glasses of water every day.", reason: "water는 불가산이라 glasses of water로 셉니다." },
    { category: "수량", q: "My brother puts (   ) on his sandwich.", ko: "내 남동생은 샌드위치에 치즈 두 장을 넣는다.", options: ["two cheeses", "two slices of cheese", "a cheese", "many cheese"], ansIdx: 1, answer: "My brother puts two slices of cheese on his sandwich.", reason: "cheese는 slices 단위로 세어야 자연스럽습니다." },
    { category: "수량", q: "Would you like some (   )?", ko: "빵 좀 드시겠어요?", options: ["breads", "bread", "a bread", "many bread"], ansIdx: 1, answer: "Would you like some bread?", reason: "bread는 불가산 명사로 사용됩니다." }
];

const articleQuiz = [
    { category: "관사", q: "I want (   ) new cell phone.", ko: "나는 새 휴대전화를 원한다.", options: ["a", "an", "the", "x"], ansIdx: 0, answer: "I want a new cell phone.", reason: "처음 언급하는 단수 명사는 a/an을 씁니다." },
    { category: "관사", q: "My uncle is (   ) English teacher.", ko: "우리 삼촌은 영어 교사다.", options: ["a", "an", "the", "x"], ansIdx: 1, answer: "My uncle is an English teacher.", reason: "English는 모음 소리로 시작해 an을 씁니다." },
    { category: "관사", q: "Do you have (   ) MP3 player?", ko: "너는 MP3 플레이어가 있니?", options: ["a", "an", "the", "x"], ansIdx: 1, answer: "Do you have an MP3 player?", reason: "MP3의 첫소리는 모음 소리라 an을 씁니다." },
    { category: "관사", q: "Brad plays (   ) guitar very well.", ko: "브래드는 기타를 매우 잘 친다.", options: ["a", "an", "the", "x"], ansIdx: 2, answer: "Brad plays the guitar very well.", reason: "악기명 앞에는 the를 씁니다." },
    { category: "관사", q: "We usually go for a walk in (   ) morning.", ko: "우리는 보통 아침에 산책한다.", options: ["a", "an", "the", "x"], ansIdx: 2, answer: "We usually go for a walk in the morning.", reason: "in the morning이 고정 표현입니다." },
    { category: "관사", q: "Does Emma go to (   ) school by (   ) bus?", ko: "엠마는 버스로 등교하니?", options: ["the / a", "a / the", "x / x", "the / x"], ansIdx: 2, answer: "Does Emma go to school by bus?", reason: "go to school, by bus는 무관사 표현입니다." },
    { category: "관사", q: "It is (   ) unlucky day today.", ko: "오늘은 운이 없는 날이다.", options: ["a", "an", "the", "x"], ansIdx: 1, answer: "It is an unlucky day today.", reason: "unlucky는 모음 소리로 시작합니다." },
    { category: "관사", q: "I want to go to (   ) moon.", ko: "나는 달에 가고 싶다.", options: ["a", "an", "the", "x"], ansIdx: 2, answer: "I want to go to the moon.", reason: "유일한 대상 앞에는 the를 씁니다." },
    { category: "관사", q: "My niece plays (   ) violin.", ko: "내 조카는 바이올린을 연주한다.", options: ["a", "an", "the", "x"], ansIdx: 2, answer: "My niece plays the violin.", reason: "악기명 앞에는 the를 씁니다." },
    { category: "관사", q: "My father is (   ) honest man.", ko: "우리 아버지는 정직한 분이다.", options: ["a", "an", "the", "x"], ansIdx: 1, answer: "My father is an honest man.", reason: "honest의 h는 묵음이라 an을 씁니다." }
];

const allQuizMaster = [...nounQuiz, ...quantifierQuiz, ...articleQuiz];
const shuffleArray = (arr) => [...arr].sort(() => Math.random() - 0.5);
const buildQuizSequence = () => {
    const nouns = shuffleArray(allQuizMaster.filter((q) => q.category === "명사"));
    const quant = shuffleArray(allQuizMaster.filter((q) => q.category === "수량"));
    const article = shuffleArray(allQuizMaster.filter((q) => q.category === "관사"));
    return [...nouns, ...quant, ...article];
};

const App = () => {
    const [quizIndex, setQuizIndex] = useState(0);
    const [quizFeedback, setQuizFeedback] = useState("");
    const [shuffledQuiz, setShuffledQuiz] = useState([]);
    const [isCorrect, setIsCorrect] = useState(false);

    const speak = (text) => {
        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = "en-US";
            uttr.rate = 0.88;
            window.speechSynthesis.speak(uttr);
        }
    };

    useEffect(() => {
        setShuffledQuiz(buildQuizSequence());
    }, []);

    const handleAnswer = (clickedIdx) => {
        if (isCorrect) return;
        const current = shuffledQuiz[quizIndex];
        if (clickedIdx === current.ansIdx) {
            setIsCorrect(true);
            setQuizFeedback(`정답입니다! ${current.reason}`);
            speak(current.answer);
            return;
        }
        setIsCorrect(false);
        setQuizFeedback("다시 생각해보세요. 가산/불가산과 관사 규칙을 먼저 점검하세요.");
    };

    const nextQuestion = () => {
        if (quizIndex < shuffledQuiz.length - 1) {
            setQuizIndex(quizIndex + 1);
            setQuizFeedback("");
            setIsCorrect(false);
            return;
        }
        setQuizFeedback("30문제를 모두 완료했습니다. 다시 도전해보세요.");
    };

    const restartQuiz = () => {
        setShuffledQuiz(buildQuizSequence());
        setQuizIndex(0);
        setQuizFeedback("");
        setIsCorrect(false);
    };

    const currentQ = shuffledQuiz[quizIndex];
    const speakingSentences = useMemo(() => allQuizMaster.map((item) => ({ en: item.answer, ko: item.ko })), []);
    const progressPercent = shuffledQuiz.length ? Math.round((quizIndex / shuffledQuiz.length) * 100) : 0;

    return (
        <div className="lesson-root min-h-screen bg-slate-50 text-slate-900 pb-12 overflow-x-hidden antialiased">
            <header className="bg-white border-b sticky top-0 z-50 shadow-sm px-4 py-4">
                <div className="content-shell flex justify-between items-center">
                    <div className="flex items-center gap-2">
                        <div className="bg-blue-600 text-white p-2 rounded-xl shadow-lg shadow-blue-100"><Icons.Zap /></div>
                        <div className="text-left">
                            <h1 className="text-2xl font-black tracking-tighter italic leading-none">Grammar CHECK CHECK</h1>
                            <span className="text-blue-600 font-black text-xs mt-1 block tracking-tight italic">중학영어 1-A / Lesson 3. Mike Is a Doctor.</span>
                        </div>
                    </div>
                </div>
            </header>

            <main className="content-shell p-4 md:p-6 space-y-8">
                <section className="bg-white rounded-[3rem] p-8 md:p-10 shadow-2xl border border-slate-100 text-left">
                    <h2 className="text-3xl font-black text-slate-800 italic mb-8 underline decoration-blue-100 underline-offset-8">기초 복습: 명사와 관사</h2>
                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="bg-slate-50 p-6 rounded-3xl border border-slate-100">
                            <h3 className="text-xl font-black text-slate-800 mb-3">1. 명사 기초</h3>
                            <p className="text-sm font-bold text-slate-600 leading-relaxed italic">
                                명사(名詞)는 사람, 사물, 장소, 개념의 이름입니다.
                                <br />예: boy, car, apple, city
                            </p>
                            <div className="mt-4 bg-white p-5 rounded-2xl border-l-4 border-blue-400 shadow-sm">
                                <p className="text-sm font-bold text-slate-800">셀 수 있는 명사와 셀 수 없는 명사를 구분하면 관사 선택이 쉬워집니다.</p>
                                <div className="mt-4 pt-4 border-t border-slate-100">
                                    <p className="font-black text-blue-700 italic text-xl cursor-pointer sentence-box p-3 rounded-xl" onClick={() => speak("My cousin lives in Seoul.")}>My cousin lives in Seoul. (내 사촌은 서울에 산다.)</p>
                                    <p className="font-black text-blue-700 italic text-xl mt-3 cursor-pointer sentence-box p-3 rounded-xl" onClick={() => speak("Water is very important for life.")}>Water is very important for life. (물은 삶에 매우 중요하다.)</p>
                                </div>
                            </div>
                        </div>
                        <div className="bg-blue-50 p-6 rounded-3xl border border-blue-100">
                            <h3 className="text-xl font-black text-blue-800 mb-3">2. 관사 기초: a/an/the</h3>
                            <p className="text-sm font-bold text-slate-700 leading-relaxed italic mt-2">a/an은 처음 언급하는 단수 명사, the는 서로 아는 대상을 가리킬 때 씁니다.</p>
                            <ul className="mt-4 space-y-2 text-sm font-bold">
                                <li className="bg-white p-2 rounded-lg border border-blue-100 cursor-pointer" onClick={() => speak("He gives me a flower every day.")}>He gives me a flower every day. (그는 매일 나에게 꽃 한 송이를 준다.)</li>
                                <li className="bg-white p-2 rounded-lg border border-blue-100 cursor-pointer" onClick={() => speak("Would you like some bread?")}>Would you like some bread? (빵 좀 드시겠어요?)</li>
                                <li className="bg-white p-2 rounded-lg border border-blue-100 cursor-pointer" onClick={() => speak("My hobby is playing the piano.")}>My hobby is playing the piano. (내 취미는 피아노를 치는 것이다.)</li>
                                <li className="bg-white p-2 rounded-lg border border-blue-100 cursor-pointer" onClick={() => speak("I go to school by bus.")}>I go to school by bus. (나는 버스로 등교한다.)</li>
                            </ul>
                        </div>
                    </div>
                    <div className="mt-6 bg-amber-50 p-5 rounded-2xl border-l-4 border-amber-500">
                        <p className="font-bold text-amber-800">Tony's Strategy - 한자 풀이: 명사(名詞)는 "이름을 붙여 말하는 말"이다. 이름이 붙으면 문장 성분(주어/목적어/보어)으로 쓰인다.</p>
                    </div>
                </section>

                <section className="bg-white rounded-[3rem] p-8 md:p-10 shadow-xl border border-slate-100 text-left">
                    <h3 className="text-2xl font-black text-slate-800 italic mb-8">중등 심화 확장: 명사 분류와 수량 표현</h3>
                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="bg-green-50 p-6 rounded-3xl border border-green-100">
                            <h4 className="text-xl font-black text-green-700 mb-4">명사의 5종류</h4>
                            <ul className="space-y-2 font-bold text-slate-700">
                                <li className="bg-white p-2 rounded-lg border border-green-100">보통명사: boy, city, flower</li>
                                <li className="bg-white p-2 rounded-lg border border-green-100">집합명사: class, family, team</li>
                                <li className="bg-white p-2 rounded-lg border border-green-100">물질명사: water, gas, flour</li>
                                <li className="bg-white p-2 rounded-lg border border-green-100">고유명사: Seoul, Mexico, Tony</li>
                                <li className="bg-white p-2 rounded-lg border border-green-100">추상명사: hope, advice, friendship</li>
                            </ul>
                            <div className="mt-4 bg-white p-4 rounded-2xl border-l-4 border-green-500 sentence-box cursor-pointer" onClick={() => speak("I need a piece of advice.") }>
                                <p className="font-black text-green-800">I need a piece of advice. (나는 조언 한 마디가 필요하다.)</p>
                                <p className="text-sm text-slate-600">advice는 불가산 명사이므로 piece 같은 단위 표현이 필요합니다.</p>
                            </div>
                        </div>
                        <div className="bg-orange-50 p-6 rounded-3xl border border-orange-100">
                            <h4 className="text-xl font-black text-orange-700 mb-4">수량 표현 핵심</h4>
                            <ul className="space-y-2 font-bold text-slate-700">
                                <li className="bg-white p-2 rounded-lg border border-orange-100">many / a few / few + 셀 수 있는 명사</li>
                                <li className="bg-white p-2 rounded-lg border border-orange-100">much / a little / little + 셀 수 없는 명사</li>
                                <li className="bg-white p-2 rounded-lg border border-orange-100">a lot of + 공통</li>
                                <li className="bg-white p-2 rounded-lg border border-orange-100">a cup of tea, two slices of cheese, eight glasses of water</li>
                            </ul>
                            <div className="mt-4 bg-white p-4 rounded-2xl border-l-4 border-orange-500">
                                <p className="font-black text-orange-800">My brother has many toys. (내 남동생은 장난감을 많이 가지고 있다.)</p>
                                <p className="text-sm text-slate-600 mt-1">toys는 셀 수 있는 명사라 many를 씁니다.</p>
                            </div>
                        </div>
                    </div>
                    <div className="mt-6 bg-slate-100 p-5 rounded-2xl border-l-4 border-slate-400">
                        <p className="font-bold text-slate-700">Tony's Strategy - 중등 내신 포인트: an honest man(발음 기준), the piano(악기), go to school/by bus(무관사)를 자주 물어봅니다.</p>
                    </div>
                </section>

                <section className="bg-white rounded-[3rem] p-8 md:p-10 shadow-xl border border-slate-100 text-left">
                    <h3 className="text-2xl font-black text-slate-800 italic mb-8">관사 예외와 핵심 규칙표</h3>
                    <div className="overflow-x-auto rounded-3xl border border-slate-200">
                        <table className="w-full text-sm text-center border-collapse">
                            <thead className="bg-slate-50 font-sans text-sm tracking-normal text-slate-500 border-b">
                                <tr>
                                    <th className="p-4 border-r">구분</th>
                                    <th className="p-4 border-r">핵심 규칙</th>
                                    <th className="p-4 border-r">교재 예문</th>
                                    <th className="p-4">해설</th>
                                </tr>
                            </thead>
                            <tbody className="font-bold">
                                <tr className="border-b">
                                    <td className="p-4 border-r bg-slate-50">a / an</td>
                                    <td className="p-4 border-r">발음 기준 선택</td>
                                    <td className="p-4 border-r text-blue-600">My father is an honest man. (우리 아버지는 정직한 분이다.)</td>
                                    <td className="p-4 text-left">honest의 h는 묵음이므로 an을 씁니다.</td>
                                </tr>
                                <tr className="border-b">
                                    <td className="p-4 border-r bg-slate-50">the</td>
                                    <td className="p-4 border-r">악기/유일한 대상</td>
                                    <td className="p-4 border-r text-red-600">My hobby is playing the piano. (내 취미는 피아노를 치는 것이다.)</td>
                                    <td className="p-4 text-left">악기명 앞에는 the를 씁니다.</td>
                                </tr>
                                <tr>
                                    <td className="p-4 border-r bg-slate-50">무관사</td>
                                    <td className="p-4 border-r">학교/교통수단 관용표현</td>
                                    <td className="p-4 border-r text-blue-600">I go to school by bus. (나는 버스로 등교한다.)</td>
                                    <td className="p-4 text-left">go to school, by bus는 무관사입니다.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div className="grid md:grid-cols-3 gap-4 mt-6">
                        <div className="sentence-box p-4 rounded-2xl cursor-pointer" onClick={() => speak("Would you like a cup of tea?") }>
                            <p className="font-black">Would you like a cup of tea? (차 한 잔 드시겠어요?)</p>
                        </div>
                        <div className="sentence-box p-4 rounded-2xl cursor-pointer" onClick={() => speak("She drinks eight glasses of water every day.") }>
                            <p className="font-black">She drinks eight glasses of water every day. (그녀는 매일 물 여덟 잔을 마신다.)</p>
                        </div>
                        <div className="sentence-box p-4 rounded-2xl cursor-pointer" onClick={() => speak("My brother puts two slices of cheese on his sandwich.") }>
                            <p className="font-black">My brother puts two slices of cheese on his sandwich. (내 남동생은 샌드위치에 치즈 두 장을 넣는다.)</p>
                        </div>
                    </div>
                </section>

                <section className="bg-blue-600 rounded-[3rem] p-10 text-white shadow-2xl relative overflow-hidden">
                    <div className="absolute top-0 right-0 p-12 opacity-10 rotate-12"><Icons.Microscope /></div>
                    <h3 className="text-2xl font-black mb-4 flex items-center gap-3 italic underline decoration-blue-400 underline-offset-8">
                        <Icons.Microscope /> 명사·관사 검증 연구소 (30문항)
                    </h3>
                    {shuffledQuiz.length > 0 && currentQ && (
                        <div className="bg-white/10 backdrop-blur-xl p-8 rounded-[2.5rem] border border-white/20">
                            <div className="mb-5">
                                <div className="h-3 bg-white/20 rounded-full overflow-hidden">
                                    <div className="h-full bg-yellow-300 transition-all duration-300" style={{ width: `${progressPercent}%` }}></div>
                                </div>
                                <p className="text-xs text-blue-100 mt-2 font-bold">진행도 {progressPercent}%</p>
                            </div>
                            <div className="mb-4 flex items-center justify-between gap-3">
                                <div className="px-4 py-1 bg-white/20 rounded-full text-xs font-black uppercase tracking-widest text-blue-100 font-mono italic">
                                    Quest {quizIndex + 1} / {shuffledQuiz.length}
                                </div>
                                <div className="px-4 py-1 bg-yellow-300 text-slate-900 rounded-full text-xs font-black">{currentQ.category}</div>
                            </div>
                            <div className="mb-8 text-left">
                                <p className="text-sm font-bold text-blue-200 mb-2 italic">교재 중등 3과 문장을 기반으로 알맞은 형태를 고르세요.</p>
                                <p className="text-lg font-black bg-blue-900/50 p-5 rounded-xl border border-white/10 text-yellow-300">{currentQ.ko}</p>
                            </div>
                            <p className="text-xl font-black mb-8 tracking-tight text-left">Q. {currentQ.q}</p>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                {currentQ.options.map((opt, i) => (
                                    <button
                                        key={`${quizIndex}-${i}`}
                                        onClick={() => handleAnswer(i)}
                                        className={`quiz-btn py-4 rounded-2xl font-black shadow-lg text-base ${isCorrect && i === currentQ.ansIdx ? "bg-yellow-400 text-slate-900" : "bg-white text-blue-600 hover:bg-blue-50"}`}
                                        disabled={isCorrect && i !== currentQ.ansIdx}
                                    >
                                        {opt}
                                    </button>
                                ))}
                            </div>
                            {quizFeedback && (
                                <div className="mt-8 p-6 bg-white/20 rounded-2xl border border-white/30 text-left">
                                    <p className="text-sm font-bold flex items-center gap-2 leading-relaxed"><Icons.CheckCircle2 /> {quizFeedback}</p>
                                    <div className="mt-3 p-4 rounded-xl bg-blue-950/30 border border-white/20">
                                        <p className="font-black">{currentQ.answer} ({currentQ.ko})</p>
                                    </div>
                                    <div className="flex gap-3 mt-6">
                                        <button onClick={() => speak(currentQ.answer)} className="flex-1 bg-white/20 text-white py-3 rounded-xl font-black shadow-md flex items-center justify-center gap-2 hover:bg-white/30">
                                            <Icons.Volume2 size={16} /> 정답 문장 다시 듣기
                                        </button>
                                        {isCorrect && (
                                            <button
                                                onClick={() => {
                                                    if (quizIndex < shuffledQuiz.length - 1) {
                                                        nextQuestion();
                                                    } else {
                                                        restartQuiz();
                                                    }
                                                }}
                                                className="flex-1 bg-yellow-400 text-slate-900 py-3 rounded-xl font-black shadow-md hover:bg-yellow-300 transition-colors"
                                            >
                                                {quizIndex < shuffledQuiz.length - 1 ? "다음 문항" : "다시 도전"}
                                            </button>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </section>

                <section className="bg-slate-100 rounded-[3rem] p-10 shadow-inner">
                    <div className="flex items-center justify-between mb-8">
                        <h3 className="text-2xl font-black text-slate-800 flex items-center gap-2 italic">
                            <Icons.Volume2 className="text-blue-600" /> 문장 낭독 훈련 (30문장)
                        </h3>
                    </div>
                    <div className="grid md:grid-cols-2 gap-4">
                        {speakingSentences.map((item, idx) => (
                            <div
                                key={idx}
                                className="bg-white p-5 rounded-2xl flex justify-between items-center border border-slate-200 hover:border-blue-400 transition-all hover:shadow-lg group cursor-pointer text-left"
                                onClick={() => speak(item.en)}
                            >
                                <div className="flex-1 pr-4">
                                    <p className="text-sm font-black text-slate-800 leading-tight group-hover:text-blue-600">{item.en}</p>
                                    <p className="text-xs text-slate-400 mt-2 font-medium">({item.ko})</p>
                                </div>
                                <div className="text-slate-300 group-hover:text-blue-500">
                                    <Icons.PlayCircle size={24} />
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            </main>

            <footer className="content-shell px-4 mt-20 text-center border-t-2 border-slate-100 pt-10 pb-20">
                <div className="max-w-4xl mx-auto">
                    <h3 className="text-2xl font-black text-gray-800 mb-2 italic">Tony's Speaking English Grammar</h3>
                    <p className="text-lg text-orange-600 font-bold mb-4">영어가 터지는 비결은 바로 <span className="underline">어순 감각</span>에 있습니다.</p>
                    <div className="h-1.5 w-16 bg-orange-400 mx-auto mb-8 rounded-full"></div>
                    <div className="text-gray-500 text-sm leading-relaxed italic font-bold">
                        <span>Tony's Speaking English Grammar helps you master the natural sense of English word order.</span>
                        <span className="not-italic font-bold text-xs mt-4 block opacity-40">© 2026 Tony's English. All rights reserved.</span>
                    </div>
                </div>
            </footer>
        </div>
    );
};

const container = document.getElementById("root");
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>
</body>
</html>
