<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>초등 문법 - 한림청소년문화의집 방과후영어</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --brand-dark:#1f3556;
    --brand:#2b5aa6;
    --accent:#7b1fa2;
    --card-bg:#ffffff;
    --page-bg:#f0f4f8;
    --text:#111827;
    --muted:#6b7280;
  }

  body{ font-family:'Noto Sans KR','Inter',sans-serif; background:var(--page-bg); color:var(--text); }

  .header-container{
    position: relative;
    height: 300px;
    background-image: url('https://raw.githubusercontent.com/tonykks/hallim-youth-english/main/images/%EC%A0%84%EA%B2%BD%EC%82%AC%EC%A7%84.jpg');
    background-size: cover;
    background-position: center;
    border-bottom: 4px solid var(--brand);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#fff;
  }
  .header-overlay{
    position:absolute;
    inset:0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(2px);
    z-index:1;
  }
  .header-content{ position:relative; z-index:2; }
  .main-title{
    font-size:2.6rem;
    font-weight:900;
    text-shadow:2px 2px 12px rgba(0,0,0,0.9);
  }

  .navbar{ background:var(--brand-dark); position:sticky; top:0; z-index:50; }
  .nav-btn{
    background:transparent;
    color:rgba(255,255,255,0.9);
    padding:12px 18px;
    font-weight:600;
    border-radius:8px;
    text-decoration:none;
    font-size:1rem;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .nav-btn:hover{ background:rgba(255,255,255,0.14); color:#fff; }
  .nav-btn.active{ background:var(--brand); color:#fff; }

  /* 드롭다운 */
  .nav-item{ position:relative; padding-bottom:10px; }
  .nav-btn .caret{ font-size:0.85rem; opacity:0.85; transform: translateY(1px); }

  .dropdown-menu{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top: calc(100% - 6px);
    margin-top: 0;
    background:linear-gradient(180deg,#3b6cc2 0%, #2b5aa6 100%);
    border-radius:16px;
    padding:14px;
    box-shadow:0 12px 28px rgba(0,0,0,0.35);
    display:none;
    z-index:200;
  }
  .nav-item:hover .dropdown-menu,
  .nav-item:focus-within .dropdown-menu{ display:flex; }

  .dropdown-row{ display:flex; gap:16px; }

  .dropdown-item{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:14px 20px;
    border-radius:14px;
    color:#fff;
    text-decoration:none;
    font-weight:800;
    background:rgba(255,255,255,0.12);
    min-width:120px;
    font-size:1rem;
    transition:all 0.2s ease;
  }
  .dropdown-item:hover{
    background:rgba(255,255,255,0.28);
    transform:translateY(-2px);
  }

  .content-container{
    max-width:900px;
    margin:3rem auto;
    padding:0 1.5rem;
    text-align:center;
  }

  .page-title{
    font-size:2rem;
    font-weight:800;
    color:var(--brand-dark);
    margin-bottom:0.5rem;
  }

  .page-desc{
    color:var(--muted);
    font-size:1.1rem;
    margin-bottom:2rem;
  }

  .quiz-list{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap:16px;
  }

  .quiz-btn{
    display:flex;
    align-items:center;
    text-decoration:none;
    background:var(--card-bg);
    color:var(--text);
    padding:18px 24px;
    border-radius:12px;
    font-weight:700;
    border:1px solid #e5e7eb;
    box-shadow:0 4px 6px rgba(0,0,0,0.02);
    transition:all 0.2s;
    font-size:1rem;
  }

  .left{ display:flex; align-items:center; gap:12px; text-align:left; }

  .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:48px;
    height:36px;
    border-radius:10px;
    font-weight:900;
    font-size:0.95rem;
    background:rgba(43,90,166,0.12);
    color:var(--brand);
  }

  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:2000; backdrop-filter: blur(4px); }
  .modal-content{ background:var(--card-bg); padding:2rem; border-radius:1rem; width:90%; max-width:420px; text-align:center; }
</style>
</head>

<body>

<header class="header-container">
  <div class="header-overlay"></div>
  <div class="header-content">
    <h1 class="main-title">한림청소년문화의집 방과후영어</h1>
  </div>
</header>

<nav class="navbar flex justify-center flex-wrap shadow-md">
  <a href="index.html" class="nav-btn">Home</a>

  <div class="nav-item">
    <a href="e.html" class="nav-btn active">초등학생 <span class="caret">▾</span></a>
    <div class="dropdown-menu">
      <div class="dropdown-row">
        <a class="dropdown-item" href="e_grammar.html">초등문법</a>
        <a class="dropdown-item" href="e.html">연습문제</a>
      </div>
    </div>
  </div>

  <div class="nav-item">
    <a href="m.html" class="nav-btn">중학생 <span class="caret">▾</span></a>
    <div class="dropdown-menu">
      <div class="dropdown-row">
        <a class="dropdown-item" href="m_grammar.html">중등문법</a>
        <a class="dropdown-item" href="m.html">연습문제</a>
      </div>
    </div>
  </div>

  <a href="#" class="nav-btn" id="contact-btn">Contact</a>
</nav>

<main class="content-container">
  <h2 class="page-title">초등 문법 (Elementary Grammar)</h2>
  <p class="page-desc">Grammar, ZAP! 입문 1, 2 과정</p>

  <div class="quiz-list" id="lesson-links"></div>
</main>

<div id="contact-modal" class="modal">
  <div class="modal-content">
    <h3 class="text-2xl font-bold mb-4">Contact Me</h3>
    <p><strong>📧 Email:</strong> smile21c@korea.com</p>
    <button id="close-modal-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition mt-4">닫기 (Close)</button>
  </div>
</div>

<script>
  const LESSON_TITLES = [
    "알파벳과 수 세기",
    "명사(1)",
    "명사(2)",
    "관사",
    "인칭대명사와 지시대명사",
    "인칭대명사의 주격과 목적격",
    "인칭대명사의 소유격",
    "be동사 am, are, is",
    "be동사의 부정문과 의문문(1)",
    "be동사의 부정문과 의문문(2)",
    "일반동사",
    "일반동사의 부정문과 의문문",
    "형용사",
    "부사와 전치사",
    "의문사(1)",
    "의문사(2)",
    "현재 진행형",
    "현재 진행형의 부정문과 의문문",
    "조동사 can",
    "명령문"
  ];

  const BASE = "https://tonykks.github.io/hallim-youth-english/contents/";
  const container = document.getElementById("lesson-links");

  for (let i = 1; i <= 20; i++) {
    const a = document.createElement("a");
    a.className = "quiz-btn";
    a.target = "_blank";
    a.href = `${BASE}lesson_${i}.html`;

    const left = document.createElement("span");
    left.className = "left";

    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = i + "과";

    const title = document.createElement("span");
    title.textContent = LESSON_TITLES[i - 1];

    left.appendChild(badge);
    left.appendChild(title);
    a.appendChild(left);
    container.appendChild(a);
  }

  const contactBtn = document.getElementById('contact-btn');
  const contactModal = document.getElementById('contact-modal');
  const closeBtn = document.getElementById('close-modal-btn');

  contactBtn.addEventListener('click', function(e){
    e.preventDefault();
    contactModal.style.display='flex';
  });
  closeBtn.addEventListener('click', function(){
    contactModal.style.display='none';
  });
  window.addEventListener('click', function(e){
    if(e.target===contactModal) contactModal.style.display='none';
  });
</script>

</body>
</html>
